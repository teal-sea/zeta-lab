# .github/workflows/ci.yml for the standalone repo
name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: get cache
        run: lake exe cache get
      - name: build
        run: lake build
      - name: no sorrys
        run: "! grep -rn --include='*.lean' -E '\\bsorry\\b' ZetaLean/ ZetaLean.lean"
