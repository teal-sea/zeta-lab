[project]
name = "bloch-certificate"
description = "Archive-backed Bloch certificate reproduction and near-branch target calibration"
version = "0.1.1"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Thomas Lince"}]
readme = "README.md"
tags = ["math", "tool-use", "eval", "certificate-verification"]
dependencies = ["verifiers==0.2.1", "python-flint==0.9.0", "numpy==2.5.1", "scipy==1.18.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bloch_certificate"]

[tool.hatch.build.targets.sdist]
include = ["bloch_certificate", "tests", "README.md", "MISSION.md", "LICENSE", "THIRD_PARTY.md", "pyproject.toml"]

[project.scripts]
bloch-prepare = "bloch_certificate.cli:main_prepare"
bloch-smoke = "bloch_certificate.cli:main_smoke"

[tool.verifiers.eval]
num_examples = 4
rollouts_per_example = 1
