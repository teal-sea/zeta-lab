name = "ThreePoint"
defaultTargets = ["ThreePoint"]

# The advertised development, by path rather than by git, so that this package
# proves things about the *same* `Kfun`, `kfun`, `wfun` and `F` that
# `lean/bridge/Zeta23Ext/Bridge/Defs.lean` defines and that
# `Zeta23Ext.Bridge.n_point_bound` takes as its hypothesis. Mathlib, Batteries
# and `anthropics/zeta-23-lean` are inherited from it at its pinned revisions.
#
# This package is NOT part of the Palomar submission surface. Nothing in
# `lean/bridge` imports it.
[[require]]
name = "Zeta23Bridge"
path = "../../../lean/bridge"

# `autoImplicit` off, deliberately, and this is not a style preference.
# With it on, an unresolved identifier in a theorem *statement* is silently
# bound as an implicit variable rather than reported: the first build of this
# package briefly stated its advertised theorems about free variables named
# `HD`, `Ncount` and `N0simple` instead of the bridge's definitions, and it
# errored only because a variable cannot be applied to an argument. Had those
# names been nullary the file would have compiled, and the theorems would have
# said nothing while looking exactly like success. For a package whose whole
# claim is that a named constant is unconditional, that failure mode has to be
# impossible rather than unlikely.
[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "ThreePoint"
