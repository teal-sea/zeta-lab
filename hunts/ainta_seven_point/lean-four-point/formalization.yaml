      lean: "Zeta23Ext.PalomarFourPoint.four_point_bound"
      module: "StrongerSolution"
      status: "pending port verification"
    - source: "The same coefficient as a ratio, without a denominator hypothesis"
      lean: "Zeta23Ext.PalomarFourPoint.four_point_bound_ratio"
      module: "StrongerSolution"
      status: "pending port verification"

acknowledgements: >-
