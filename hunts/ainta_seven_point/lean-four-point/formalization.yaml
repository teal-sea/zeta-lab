# Draft port metadata. Final compilation and comparison remain pending.
version: "v0.4"

project:
  name: "Zeta Lab: stronger four-point simple-zero bound"
  description: >-
    Let N(T,2T) count nontrivial zeros of Mathlib's Riemann zeta function
    with multiplicity, and let N_0^s(T,2T) count simple zeros on the critical
    line in the same ordinate interval. The two advertised declarations
    state that, for every eps > 0 and all sufficiently large T,
    ((14400000 H - 17240)/14366681 - eps) N(T,2T) <= N_0^s(T,2T),
    and the corresponding ratio bound without a positivity hypothesis.
    Here H = 3/2 - cot(1/sqrt(2))/sqrt(2) is the upstream Theorem D constant.
    The coefficient is approximately 0.6728603588388667. This improves the
    lab's earlier kernel-checked four-point coefficient, approximately
    0.6728470197666888. It is not a claim to the largest published numerical
    bound in the wider family. At parameters (n,c,m,p) =
    (4,2330/1000000,432,2500), the finite inequality used by the lab's
    n-point adaptation of Ainta's argument is proved rather than assumed.
    The coefficient is unconditional; the statement is not RH and holds
    whether or not RH is true. The historical Lean 4.33 build is recorded;
    verification of the Lean 4.35 port and this new interface is in progress.
  authors: ["Thomas Lince"]
  responsible_maintainers: ["Thomas Lince"]
  license: "MIT"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11M26", "15A42"]

