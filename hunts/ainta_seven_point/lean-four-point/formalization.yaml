    The historical FourPointCand package compiled on Lean 4.33.0-rc2 at
    source 5522b96314f7f63198ae3ec4e71d954255f93d1a, with 49 successful
    receipts and six standard-axiom reports. The evidence and its saved-image
    lineage limitations are documented in hunts/four_point_pressure/evidence.
    The Lean 4.35.0-rc2 port rebuilt the consumed analytic dependencies,
    all 48 original proof modules and the separate interface pair in
    checkpointed GitHub Actions jobs. Final assembly and both interface
    modules passed in run 36633942493. The comparison passed in run
    36637271632 at source 3ee65788397d0eed8c4743704492dae159cde521:
    both selected statements matched, and Lean, NanoDa and con-ron accepted
    the exported solution. A matching control passed and an intentionally
    mismatched statement was rejected. Lean parsed all 645 tracked source
    headers as modules. StrongerChallenge has two deliberate statement
    placeholders; StrongerSolution has none. This incremental lab build and
    comparison are not Palomar's fresh protected-source verification pipeline.
    No new registration or external mathematical review is claimed.
    The September 30 resource repair adds import dependencies to bound
    certificate build concurrency after the full protected-source preflight
    exhausted its worker memory. All certificate proof bodies and advertised
    statements are unchanged. The resource-repaired snapshot requires its
    own complete preflight; previous incremental checks are not that result.

automation:
  methods:
    - method: "agent"
      framework: "Zeta Lab"
      tool_setup: >-
        The existing proof and rational-enclosure generators were developed
        through AI-assisted work under human direction. Hermes supplied the
        historical build record. Codex prepared this compiler/module port
        and the separate comparison interface. GitHub Actions builds the
        port in bounded sequential units with checkpoints and raw logs.
  spend_usd: "not tracked across the full development"

fidelity:
  divergences: >-
    This is an n = 4 instance of the lab's n-point adaptation of Ainta's
    seven-point argument. The finite certificate is proved inside Lean.
    The copied counting definitions are tied to the development by rfl;
    the closed-form H is tied to HD 1 by the upstream HD_one theorem.
    Original provenance is recorded; literature-wide novelty is not claimed.

review:
  status: "self-assessed, lab kernel checks passed; external review pending"
  notes: >-
    The two advertised declarations are the bound and its ratio form.
    Static checks compare their statement text with the candidate theorem,
    verify the shared definitions and prohibit importing Challenge into
    Solution. Compilation and the exported-proof comparison also passed;
    the final theorem and both Solution declarations use only the three
    standard axioms. These are laboratory checks, pending external verification.

