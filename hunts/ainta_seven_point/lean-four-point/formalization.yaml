      claim authorship of the upstream mathematics or proofs.

status:
  scope: >-
    The historical FourPointCand package compiled on Lean 4.33.0-rc2 at
    source 5522b96314f7f63198ae3ec4e71d954255f93d1a, with 49 successful
    receipts and six standard-axiom reports. The evidence and its saved-image
    lineage limitations are documented in hunts/four_point_pressure/evidence.
    The Lean 4.35.0-rc2 port has rebuilt the analytic bridge and begun the
    generated certificate. StrongerSolution and the final comparison remain
    unverified on this toolchain. StrongerChallenge has two deliberate
    statement placeholders; StrongerSolution has no such placeholders.
    No new registration or external mathematical review is claimed.

automation:
  methods:
    - method: "agent"
      framework: "Zeta Lab"
      tool_setup: >-
        The existing proof and rational-enclosure generators were developed
        through AI-assisted work under human direction. Hermes supplied the
        historical build record. Codex prepared this compiler/module port
        and the separate comparison interface. GitHub Actions builds the
        port in bounded sequential units with checkpoints and raw logs.
  spend_usd: "not tracked across the full development"

fidelity:
  divergences: >-
    This is an n = 4 instance of the lab's n-point adaptation of Ainta's
    seven-point argument. The finite certificate is proved inside Lean.
    The copied counting definitions are tied to the development by rfl;
    the closed-form H is tied to HD 1 by the upstream HD_one theorem.
    Original provenance is recorded; literature-wide novelty is not claimed.

review:
  status: "self-assessed, port verification in progress"
  notes: >-
    The two advertised declarations are the bound and its ratio form.
    Static checks compare their statement text with the candidate theorem,
    verify the shared definitions and prohibit importing Challenge into
    Solution. They do not replace compilation or Comparator. The historical
    kernel build is laboratory evidence, pending external verification.

alignment:
  namespace: "Zeta23Ext.PalomarFourPoint"
  statements:
