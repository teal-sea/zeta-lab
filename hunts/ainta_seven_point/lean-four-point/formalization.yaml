      040c5e899e658aed7b56a2a87f501798fe10761d. The lab's n-point
      generalization and four-point finite enclosure are distinct work.
      This entry does not claim the base argument as its own.
    license: "unknown"
    author_endorsement: "no-response"
  - title: "More than two thirds of the zeta zeros are simple and on the critical line"
    authors: ["L. Alpoge", "R. Furman"]
    type: "paper"
    location: "https://arxiv.org/abs/2608.13637"
    relationship: background
    note: >-
      The analytic foundation and base constant are supplied by the
      accompanying anthropics/zeta-23-lean development, not by this entry.
  - title: "SamiYaya's separately reported four-point parameter candidate"
    authors: ["SamiYaya"]
    type: "web discussion"
    location: "https://github.com/teal-sea/zeta-lab/issues/254"
    relationship: background
    note: >-
      The separate tuple is (4,2320/1000000,434,2500). This entry instead
      uses the lab's September 5 candidate (4,2330/1000000,432,2500).
      SamiYaya's contribution is acknowledged separately; its proof is not
      incorporated or claimed to have been rebuilt here.

related_formalizations:
  - id: "https://github.com/anthropics/zeta-23-lean"
    relationship: builds-on
    note: >-
      Source revision 3635e74826a4c1fcece7d1cd2b6fa75e43a00510, retained
      under lean/vendor/zeta23 with its Apache-2.0 license and attribution.
      This port changes module visibility and Mathlib API calls, preserving
