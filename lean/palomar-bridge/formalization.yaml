      and the spectral calculus specMap. The advertised theorem is its
      thmD_0_simple_mult with HD 1 replaced by Phi c m p; dropping the defect
      recovers that theorem. Nothing in the dependency was modified.

status:
  scope: >-
    Formalized: the four advertised declarations, sorry-free, against pinned
    Mathlib v4.33.0-rc2 and anthropics/zeta-23-lean at the pinned commit, with
    #print axioms reporting exactly propext, Classical.choice and Quot.sound
    for each of the four.
    CONDITIONAL, AND THE CERTIFICATE IS A HYPOTHESIS, NOT A LEAN FACT.
    seven_point_bound takes the named hypothesis hCert, which says: for every
    g : Fin 6 -> R with every g i >= 0, c <= F6 p g, where F6 is Ainta's
    seven-point functional (the pressure term (1/p) sum g_i plus the 21
    pairwise overlap weights w(y_j - y_i) = k(y_j - y_i)^2 with coefficient
    2/(7-r) for a pair spanning r gaps). This is the paper's Proposition 4.1.
    What is known about it is that an interval-arithmetic program written in
    Arb accepts it: at (c, p) = (19/5000, 3000) in the published run at
    github.com/ainta/zeta-simple-zeros, which this laboratory reproduced field
    for field, and at (34697/10^7, 3400) in this laboratory's own run, both
    recorded under hunts/ainta_seven_point in the submitted repository. A
    verifier's acceptance is not a kernel-checked proof and no claim is made
    here that it is; re-enclosing the underlying sinc table inside Lean is a
    separate project of a different size. The hypothesis is written into every
    advertised statement, with its numbers, rather than assumed as an axiom,
    exactly so that this distinction survives every way of quoting the result.
    Each statement also takes hA0 : c(m-6) <= 1, a rational side condition, and
    the side conditions 7 <= m, 0 < p, 0 < c; in the three instantiated
    statements all four are discharged by norm_num, leaving hCert as the only
    hypothesis. Every other input, including the Riemann-von Mangoldt formula
    and the explicit formula, is discharged inside the dependency for
    riemannZeta.
    Non-vacuity of the hypothesis: F6 p 0 = 12 and F6 p g >= (1/p) sum g_i, so
    the class of (c, p) satisfying hCert is nonempty; what the certificate
    supplies is the specific value, and the theorem's interest is proportional
    to that value. The difference between the paper's constant and this
    laboratory's is a difference of assumed certificate, not of proved
    mathematics: the same parametric theorem is instantiated twice.
    Not formalized, and deliberately outside the advertised statements: the
    seven-point inequality itself, at either parameter set (a 45 600-cell
    interval table and a branch-and-bound search of 707 901 nodes at p = 3000
    and 1 112 733 at p = 3400); the eight-point generalisation, whose bridge
    from certificate to proportion this laboratory has stated but not proved
    and which is therefore not offered here at all; the Gohms variant at
    191/50000 and the other certificate targets the hunt explored; any
    numerical value of H beyond its closed form. NOTHING HERE BEARS ON THE
    RIEMANN HYPOTHESIS: the conclusion is a lower bound on a proportion of
    zeros and holds whether or not RH does. The base constant H is the
    dependency's theorem, not this submission's.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Zeta Lab, github.com/teal-sea/zeta-lab"
      tool_setup: >-
        The sixteen-step decomposition, every Lean statement and every proof
        were produced by Claude agents running in Claude Code against this
        repository: one agent wrote the end-to-end skeleton with the eleven
        unproved steps as named lemmas carrying sorry and their residual goals
        in words, four agents then closed them in parallel on disjoint files,
        and one agent integrated, built and audited. The Harmonic Aristotle
        service was available under a cap of three submissions per agent and
        was not used: zero of fifteen, because every obligation closed locally
        before a residual existed (lean/ARISTOTLE-RUNS.md, Batch 12). A further
        agent pass then packaged the result for this registry: it moved the
        development into the Lake package lean/bridge so that it assembles at a
        root, wrote the Challenge and Solution modules, added the two
        instantiations at this laboratory's own certificate parameters, and
        corrected the licence headers. No step uses native_decide and no step
        uses floating point.
      cost:
        wall_time: >-
          The skeleton, the five attack branches and the integration ran on
          2026-08-23, one working day, following a trust-map pass on
          2026-08-22 and the S2 probe earlier on 2026-08-23.
        spend_usd: "not tracked"
        hardware: "local machine; no proving service"
      prompting_notes: >-
        Statement-first, as for the laboratory's earlier submissions: the
        skeleton fixed each step's Lean statement in the dependency's own
        vocabulary, each attacker was told to leave anything unproved as a
        named lemma with its residual goal in words, and the integrator was
        told to turn leftovers into explicit hypotheses of the main theorem.
        None were left.
  spend_usd: "not tracked"
  notes: >-
    Human direction, agent proof writing, kernel checking, and an explicit
    obligation ledger per attack group under hunts/ainta_seven_point/bridge/.
    The single non-Lean input is carried as a named hypothesis of every
    advertised theorem so that the conditional result cannot be read as an
    unconditional one. The interval-arithmetic runs behind that hypothesis were
    executed by this laboratory and are recorded, with node and depth counts
    and their artifacts, in hunts/ainta_seven_point/RUNS.md and RESULTS.md;
    they are evidence for the hypothesis, not a proof of it. The derivations
    were directed and verified within an AI-assisted computational mathematics
    framework operated by Thomas Lince at Zeta Lab.

fidelity:
  divergences: >-
    The formal argument follows the paper's structure and departs from its
    text in the following places, each recorded in
    hunts/ainta_seven_point/BRIDGE.md section 6. The kernel limit (Lemma 3.1)
    is proved for every pair of retained zeros at every separation; the
    paper's bounded-separation parameter R_0 is kept in the signature but is
    not used. The tail passage (Corollary 2.2) does not pass through the
    dependency's limit over windows lambda -> 1; it re-states two of the
    dependency's endgame lemmas at lambda = 1 with the defect carried as a
    hypothesis, which their own inputs permit. Block pinching (eq:pinching) is
    proved without convexity of the matrix functional or unitary invariance,
    from the row-stochastic mixture of the spectrum of a principal submatrix
    and scalar Jensen; the partition form needs no positivity of Psi, the
    two-block form does. The block defect lemma (Lemma 4.3) is proved for
    every Hermitian matrix, positivity unused. The block energy lemma (Lemma
    4.2) is proved as a fibre count plus an exact telescoping identity, both
    needing w even. The block bound (eq:269block) uses |k| <= 1, which the
    paper does not state and which holds because cos(sqrt 2 t) >= 0 on
    [-1/2, 1/2]; its error term is 2 m^2 delta rather than an unquantified
    o(1). The averaging of section 5 is over all n-m+1 block starts with one
    pinching partition per residue class rather than over m offsets with a
    floor count. The span bound x_{S} - x_1 <= N + o(N) uses L <= l_1 (that is
    2 log 2 - 1 >= 0 at lambda = 1) and log T = o(T), neither stated in the
    paper. Every o(N) in the paper is an explicit eta N in the Lean, consumed
    as an eventually-in-T statement.

review:
  status: "self-assessed"
  notes: >-
    No external mathematical review has been performed, and no person outside
    this laboratory has read the development. "self-assessed" means exactly
    that: the checks below were run by the laboratory on its own work.
    Packaging state. The three blockers recorded here in an earlier revision
    are resolved. (1) The advertised development now lives in its own Lake
    package, lean/bridge, which requires anthropics/zeta-23-lean at the pinned
    commit and whose root module imports every module in it; `lake build` at
    that root completes with 8860 jobs and zero errors, so a replay of the
    selected project builds the theorem rather than stopping on three modules
    of hunts/frontier_math/zeta23ext that the theorem never imports
    (repository issue 101, which remains open for that other package and is
    now unrelated to this submission). (2) The Challenge and Solution modules
    named by lean/comparator-bridge.json exist: BridgeChallenge.lean states
    the four advertised theorems over Mathlib alone, in the namespace
    Zeta23Ext.Palomar, restating verbatim the five counting definitions of the
    dependency's Zeta23/Statement.lean and the five kernel and functional
    definitions of Zeta23Ext/Bridge/Defs.lean, and writing the constant H in
    the closed form the dependency's HD_one proves equal to its HD 1;
    BridgeSolution.lean proves the same four from Zeta23Ext.Bridge.Main
    through those bridges, every one of which is rfl except H_eq, which is
    HD_one. (3) The Apache-2.0 headers the Bridge files had copied from the
    dependency's house style are replaced by MIT headers matching the
    repository licence; the one file that adapts the dependency's code rather
    than importing it, Zeta23Ext/Bridge/Helpers_S8.lean, keeps its attribution
    to Anthropic, PBC and the Apache-2.0 licence of the transcribed proof
    bodies in a notice, in its own header and in lean/bridge/NOTICE.
    Deliberate sorry count. The Challenge module carries four sorry, one per
    advertised statement, which is what the Palomar format requires of a
    statement-only module. The development and the Solution module carry none:
    a whole-package build reports exactly four `declaration uses sorry`
    warnings and all four are in BridgeChallenge.lean. Any claim that this
    tree is sorry-free has to say which object it means, and this field is
    that statement.
    Internal checks performed and recorded: the four advertised declarations
    and the 72 other audited declarations in the package report exactly
    propext, Classical.choice and Quot.sound under #print axioms, 76 audit
    lines in one whole-package build (fourteen of them print Classical.choice
    as choice, because Classical is open in the module that emits them); a
    static
    scan of every Lean file in the package finds no axiom, opaque, unsafe,
    admit, native_decide, implemented_by or extern; no step lemma's statement
    was changed by any attack branch relative to the skeleton; the per-group
    ledgers under hunts/ainta_seven_point/bridge/ record zero proving-service
    submissions, zero of fifteen permitted; and the hypothesis hCert is named
    in every advertised statement and in status.scope, so no reading of this
    entry can take the result as unconditional.
    Known limitations of this self-assessment: the interval-arithmetic runs
    behind hCert were checked by reproducing a third party's run and by
    re-running a corrected variant, not by any formal method; the constants
    inside the proofs are not sharp and were not tuned; and whether a
    conditional refinement of a theorem already registered from the upstream
    repository clears this registry's notability floor is the registry's call,
    not a claim this file makes for it.

