# formalization.yaml v0.4 for a Palomar Registry submission of the Zeta Lab
# formalisation of Ainta's seven-point simple-zero bound, conditional on the
# seven-point inequality.
#
# Selected project: lean/bridge. Not lean/, because the theorem depends on
# anthropics/zeta-23-lean, which lean/ does not require; and no longer
# hunts/frontier_math/zeta23ext, which does not assemble at its root
# (repository issue 101). lean/bridge is a Lake package of its own containing
# the whole advertised development and nothing else, and `lake build` at its
# root succeeds. Comparator path: lean/comparator-bridge.json.
version: "v0.4"

project:
  name: "Zeta Lab: the seven-point simple-zero bound, formalised to its hypotheses"
  description: >-
    Let N(T,2T) count the nontrivial zeros of the Riemann zeta function with
    ordinate in (T,2T], with multiplicity, and N_0^s(T,2T) the simple zeros on
    the critical line in that range. The Lean development accompanying
    arXiv:2608.13637 (anthropics/zeta-23-lean) proves, for Mathlib's
    riemannZeta and unconditionally, that for every eps > 0 and all large T,
    (H - eps) N(T,2T) <= N_0^s(T,2T) with
    H = 3/2 - (1/sqrt 2) cot(1/sqrt 2) = 0.6725007036794116... (its Theorem D).
    Ainta (github.com/ainta/zeta-simple-zeros, paper/riemann.tex, August 2026)
    refines this to 0.6730085279277797... by a stability term in the rank-trace
    inequality: the defect D(M) = tr Psi(M) of the Gram matrix of the simple-zero
    vectors, with Psi(t) = (t-1)^2 on [0,2] and 2t-3 beyond, is carried through
    the argument, bounded below block by block through a seven-point local
    inequality F6(g) >= c on six nonnegative gaps, and solved for. The only
    computer-assisted input is that inequality, which an interval-arithmetic
    program accepts at c = 19/5000.
    This submission advertises that refinement as a theorem of Lean, conditional
    on exactly that inequality. The principal advertised statement is: for every
    real c > 0 and naturals m >= 7, p > 0 with c(m-6) <= 1, if c <= F6_p(g) for
    every nonnegative six-gap vector g (the hypothesis hCert), then for every
    eps > 0 and all large T, (Phi(c,m,p) - eps) N(T,2T) <= N_0^s(T,2T), where
    Phi(c,m,p) = (H - 6(m-1)/(pm)) / (1 - c(m-6)/m). Three corollaries
    instantiate it. The first takes (c,m,p) = (19/5000, 269, 3000), discharges
    the side conditions by norm_num, and reads (1345000 H - 2680)/1340003 - eps
    in place of Phi - eps, which is the paper's Theorem 1.1 constant exactly.
    The other two take this laboratory's own verified parameters
    (c,m,p) = (34697/10^7, 294, 3400), where the constant is
    (520625000 H - 915625)/518855453 = 0.6730295534796928...: a finer pressure
    sweep than the paper's puts the seven-point peak at p = 3400, the same
    interval-arithmetic verifier accepts c = 34697/10^7 there and refuses
    34701/10^7, and the cap c(m-6) <= 1 then gives m = 294. The last of the
    three states the conclusion as a bound on the ratio N_0^s(T,2T)/N(T,2T),
    with no positivity guard on the denominator, which is the form the result is
    usually quoted in. All four are conditional on hCert at their own
    parameters.
    What the work consists of. Every step of the paper between the finite
    inequality and the zero count is a Lean theorem with standard axioms: the
    stability rank-trace inequality (as a corollary of the upstream rank-trace
    theorem at its eigenbasis presentation), the regrouping of the normalised
    matrix into the simple-zero factor and a complement of bounded positive
    index, the counting inequality with defect, the tail passage carrying the
    defect through the upstream endgame at the lambda = 1 window (which turned
    out to be available there, so no limit over windows was needed), the
    uniform-in-T limit of the Gram entries to the Montgomery-Taylor overlap
    kernel k(x) = K(x)/K(0) (proved for every pair of retained zeros at every
    separation, without the paper's bounded-separation hypothesis), the o(N)
    count of zeros in the deleted end strips, the block energy, block defect
    and block bound lemmas, block pinching for convex trace functionals (proved
    from the fact that the spectrum of a principal submatrix of a Hermitian
    matrix is a row-stochastic mixture of its spectrum, which is absent from
    Mathlib at the pinned revision), the averaging over block starts, and the
    final linear solve. The hypothesis hCert is the paper's Proposition 4.1 and
    is not formalised; it is named in the statement and nowhere else.
    Audience. Analytic number theorists working on simple zeros and zeros on the
    critical line, for whom the question is which finite inequality a
    published proportion actually rests on and what it would take to replace
    it: the theorem exposes that dependence as a single named hypothesis and
    makes the constant a closed-form function Phi of the certificate
    parameters. It also isolates, as reusable Lean, block pinching for convex
    trace functionals on Hermitian matrices and the uniform kernel limit for
    the Montgomery-Taylor window. What the theorem asserts is bounded by the
    scope field: it is conditional on hCert, and it is evidence for nothing
    about the Riemann Hypothesis.
  authors:
    - "Thomas Lince"
  license: "MIT"
  responsible_maintainers:
    - "Thomas Lince"

