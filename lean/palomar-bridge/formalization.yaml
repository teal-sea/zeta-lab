status:
  scope: >-
    Formalized: the two advertised declarations, sorry-free, against pinned
    Mathlib v4.33.0-rc2 and anthropics/zeta-23-lean at the pinned commit, with
    #print axioms reporting exactly propext, Classical.choice and Quot.sound.
    CONDITIONAL. seven_point_bound takes the named hypothesis hCert, which
    says: for every g : Fin 6 -> R with every g i >= 0, c <= F6 p g, where F6
    is Ainta's seven-point functional (the pressure term (1/p) sum g_i plus the
    21 pairwise overlap weights w(y_j - y_i) = k(y_j - y_i)^2 with coefficient
    2/(7-r) for a pair spanning r gaps). This is the paper's Proposition 4.1
    and is not a Lean fact: an interval-arithmetic program accepts it at
    c = 19/5000, p = 3000, and this laboratory reproduced that run, but no
    kernel has checked it. It also takes hA0 : c(m-6) <= 1, a rational side
    condition discharged by norm_num at the published parameters, and the side
    conditions 7 <= m, 0 < p, 0 < c. seven_point_bound_paper takes hCert at
    (19/5000, 3000) and nothing else. Every other input, including the
    Riemann-von Mangoldt formula and the explicit formula, is discharged inside
    the dependency for riemannZeta.
    Non-vacuity of the hypothesis: F6 p 0 = 12 and F6 p g >= (1/p) sum g_i, so
    the class of (c, p) satisfying hCert is nonempty; what the certificate
    supplies is the specific value 19/5000, and the theorem's interest is
    proportional to that value.
    Not formalized, and deliberately outside the advertised statements: the
    seven-point inequality itself (a 45 600-cell interval table and a 707 901
    node branch-and-bound search, outside the scope of this submission); the
    Gohms variant at 191/50000 and the other certificate targets this
    laboratory's hunt explored; any numerical value of H beyond its closed
    form. Nothing here formalizes any statement about the Riemann Hypothesis,
    and the base constant H is the dependency's theorem, not this
    submission's.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

