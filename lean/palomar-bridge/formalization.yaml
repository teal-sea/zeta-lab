  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Zeta Lab, github.com/teal-sea/zeta-lab"
      tool_setup: >-
        The sixteen-step decomposition, every Lean statement and every proof
        were produced by Claude agents running in Claude Code against this
        repository: one agent wrote the end-to-end skeleton with the eleven
        unproved steps as named lemmas carrying sorry and their residual goals
        in words, four agents then closed them in parallel on disjoint files,
        and one agent integrated, built and audited. The Harmonic Aristotle
        service was available under a cap of three submissions per agent and
        was not used: zero of fifteen, because every obligation closed locally
        before a residual existed (lean/ARISTOTLE-RUNS.md, Batch 12). No step
        uses native_decide and no step uses floating point.
      cost:
        wall_time: >-
          The skeleton, the five attack branches and the integration ran on
          2026-08-23, one working day, following a trust-map pass on
          2026-08-22 and the S2 probe earlier on 2026-08-23.
        spend_usd: "not tracked"
        hardware: "local machine; no proving service"
      prompting_notes: >-
        Statement-first, as for the laboratory's earlier submissions: the
        skeleton fixed each step's Lean statement in the dependency's own
        vocabulary, each attacker was told to leave anything unproved as a
        named lemma with its residual goal in words, and the integrator was
        told to turn leftovers into explicit hypotheses of the main theorem.
        None were left.
  spend_usd: "not tracked"
  notes: >-
    Human direction, agent proof writing, kernel checking, and an explicit
    obligation ledger per attack group under hunts/ainta_seven_point/bridge/.
    The single non-Lean input is carried as a named hypothesis of the main
    theorem so that the conditional result cannot be read as an unconditional
    one. The derivations were directed and verified within an AI-assisted
    computational mathematics framework operated by Thomas Lince at Zeta Lab.

fidelity:
  divergences: >-
    The formal argument follows the paper's structure and departs from its
    text in the following places, each recorded in
    hunts/ainta_seven_point/BRIDGE.md section 6. The kernel limit (Lemma 3.1)
    is proved for every pair of retained zeros at every separation; the
    paper's bounded-separation parameter R_0 is kept in the signature but is
    not used. The tail passage (Corollary 2.2) does not pass through the
    dependency's limit over windows lambda -> 1; it re-states two of the
    dependency's endgame lemmas at lambda = 1 with the defect carried as a
    hypothesis, which their own inputs permit. Block pinching (eq:pinching) is
    proved without convexity of the matrix functional or unitary invariance,
    from the row-stochastic mixture of the spectrum of a principal submatrix
    and scalar Jensen; the partition form needs no positivity of Psi, the
    two-block form does. The block defect lemma (Lemma 4.3) is proved for
    every Hermitian matrix, positivity unused. The block energy lemma (Lemma
    4.2) is proved as a fibre count plus an exact telescoping identity, both
    needing w even. The block bound (eq:269block) uses |k| <= 1, which the
    paper does not state and which holds because cos(sqrt 2 t) >= 0 on
    [-1/2, 1/2]; its error term is 2 m^2 delta rather than an unquantified
    o(1). The averaging of section 5 is over all n-m+1 block starts with one
    pinching partition per residue class rather than over m offsets with a
    floor count. The span bound x_{S} - x_1 <= N + o(N) uses L <= l_1 (that is
    2 log 2 - 1 >= 0 at lambda = 1) and log T = o(T), neither stated in the
    paper. Every o(N) in the paper is an explicit eta N in the Lean, consumed
    as an eventually-in-T statement.

review:
  status: "self-assessed"
  notes: >-
    No external mathematical review has been performed. AUTHORED, NOT
    SUBMITTED, for two reasons that are about packaging and not about the
    theorem. First, the selected project hunts/frontier_math/zeta23ext does
    not assemble at its root on main (repository issue 101: three modules the
    advertised theorem never imports fail against the pinned Mathlib), and a
    registry replay builds the project; the theorem and its whole import
    closure build by name (lake build Zeta23Ext.Bridge.Main, 44 s against the
    prebuilt store, zero sorry warnings). Second, the Challenge and Solution
    modules this comparator names do not exist yet. The Challenge module would
    restate, over Mathlib alone in the namespace Zeta23Ext.Palomar, the
    dependency's IsNontrivialZero, zeroMult, zerosIn, Ncount and N0simple, the
    overlap kernel K, k and w, the seven-point functional F6, the constant H in
    its closed form and Phi, and would state the two theorems with the
    format's deliberate sorry; the Solution module would import
    Zeta23Ext.Bridge.Main and discharge them through rfl bridges and HD_one.
    It was not authored in this pass because this laboratory's rule for the
    package (tests/test_zeta23ext_imports.py) requires every module to be
    reachable from the package root and this pass required zero sorry
    anywhere in the package; a Challenge module satisfies neither, and the
    reconciliation (a separate Lake library for the surface, as lean/ does for
    its two surfaces) is a packaging decision for the owner. Also to be
    resolved before submission: the Bridge source files carry Apache-2.0
    headers copied from the dependency's house style while the repository
    licence is MIT. Internal checks performed and recorded: the two advertised
    declarations and the 70 other audited declarations in the tree report
    exactly propext, Classical.choice and Quot.sound; no step lemma's
    statement was changed by any attack branch relative to the skeleton; the
    per-group ledgers record zero proving-service submissions; and the
    hypothesis hCert is named in the statement and in the scope above, so no
    reading of this entry can take the result as unconditional.

