name = "ZetaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ZetaLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# the header linter insists on Apache-2.0 wording; this project is MIT, so the
# linter is off rather than the copyright line being wrong
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "ZetaLean"
