name = "ZetaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ZetaLean", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# the header linter insists on Apache-2.0 wording; this project is MIT, so the
# linter is off rather than the copyright line being wrong
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "ZetaLean"

# The Palomar submission surface (https://palomar-registry.org/).
#
# `Challenge.lean` is the statement-only audit surface: it imports Mathlib
# alone and carries ONE DELIBERATE `sorry`, which is what the Palomar format
# requires of an advertised statement. That `sorry` is not an uncertified step
# in the Lean arm and must not be "fixed": `Solution.lean` proves the same
# statement from `ZetaLean.Pub1`, and Comparator checks the two match.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

# The second Palomar submission surface: the Davenport-Heilbronn zero
# criterion and analytic half. Same Challenge/Solution discipline as above.
[[lean_lib]]
name = "DHChallenge"
roots = ["DHChallenge"]

[[lean_lib]]
name = "DHSolution"
roots = ["DHSolution"]

# The Erdős problem files: one file per problem number, at `Erdos/<n>.lean`.
#
# The explicit glob is load-bearing. `globs` otherwise defaults to
# `roots.map Glob.one` = build exactly the module `Erdos` and nothing under
# it, and there is no `Erdos.lean` root file, so every file in this directory
# would be built by nothing at all -- silently, with no error. `Erdos.+`
# (`Glob.submodules`) selects the submodules without demanding the root;
# `Erdos.*` would be wrong, since it also requires `Erdos` itself.
#
# Note that a numeric module component is not a legal Lean identifier, so
# importers must use French quotes: `import Erdos.«359»`.
[[lean_lib]]
name = "Erdos"
globs = ["Erdos.+"]
