name = "ZetaLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ZetaLean", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# the header linter insists on Apache-2.0 wording; this project is MIT, so the
# linter is off rather than the copyright line being wrong
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "ZetaLean"

# The Palomar submission surface (https://palomar-registry.org/).
#
# `Challenge.lean` is the statement-only audit surface: it imports Mathlib
# alone and carries ONE DELIBERATE `sorry`, which is what the Palomar format
# requires of an advertised statement. That `sorry` is not an uncertified step
# in the Lean arm and must not be "fixed": `Solution.lean` proves the same
# statement from `ZetaLean.Pub1`, and Comparator checks the two match.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

# The second Palomar submission surface: the Davenport-Heilbronn zero
# criterion and analytic half. Same Challenge/Solution discipline as above.
[[lean_lib]]
name = "DHChallenge"
roots = ["DHChallenge"]

[[lean_lib]]
name = "DHSolution"
roots = ["DHSolution"]

# Vendored from google-deepmind/formal-conjectures at 7e662f771cec2c6d893ee048d163c3cb3aa2a377
# (Apache-2.0, see FORMAL-CONJECTURES-VENDOR.md). Kept as two libraries like upstream.
# The Mathlib standard linter set is off for the copies: they are upstream's code
# and upstream's lint policy, not this project's.
[[lean_lib]]
name = "FormalConjecturesForMathlib"
[lean_lib.leanOptions]
weak.linter.mathlibStandardSet = false

[[lean_lib]]
name = "FormalConjecturesUtil"
globs = ["FormalConjecturesUtil.*"]
[lean_lib.leanOptions]
weak.linter.mathlibStandardSet = false

# Erdős-problem statements: `Erdos.lean` plus every `Erdos/*.lean`, each starting
# with `import FormalConjecturesUtil` exactly as upstream problem files do.
# Statements are advertised with `sorry`, so that warning is off as upstream does.
[[lean_lib]]
name = "Erdos"
globs = ["Erdos.*"]
[lean_lib.leanOptions]
warn.sorry = false
