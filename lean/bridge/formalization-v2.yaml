# formalization.yaml v0.4 — VERSION 2 of the Zeta Lab bridge entry.
#
# V1 (live, commit 58bd44cadb5881540af744a152492d2c25420008) advertises the
# seven-point bound, conditional on its certificate. V2 replaces it with the
# parametric n-point theorem and two instances: one UNCONDITIONAL at n = 3,
# whose certificate is proved inside Lean, and one conditional at n = 8, at the
# leading constant. Same selected project, lean/bridge; comparator
# lean/bridge/comparator-v2.json. Deliberately short: lean/PALOMAR.md says why.
version: "v0.4"

project:
  name: "Zeta Lab: the n-point simple-zero bound, with an unconditional three-point instance"
  description: >-
    Let N(T,2T) count the nontrivial zeros of the Riemann zeta function with
    ordinate in (T,2T], with multiplicity, and N_0^s(T,2T) the simple zeros
    among them on the critical line. The Lean development accompanying
    arXiv:2608.13637 (anthropics/zeta-23-lean) proves, for Mathlib's
    riemannZeta and unconditionally, that for every eps > 0 and all large T,
    (H - eps) N(T,2T) <= N_0^s(T,2T), with
    H = 3/2 - (1/sqrt 2) cot(1/sqrt 2) = 0.67250070367941164... (its Theorem D).
    Ainta (github.com/ainta/zeta-simple-zeros) refines H by carrying the
    spectral defect of the Gram matrix of the simple-zero vectors through that
    argument and bounding it block by block through a local inequality on seven
    points.
    Advertised here: that refinement carried out for n points at once, and two
    instances. Parametrically, for n >= 2, c > 0, m >= n, p > 0 with
    c(m-(n-1)) <= 1, if c <= F(n,p,g) for every nonnegative vector g of n-1 gaps
    (the hypothesis hCert), then for every eps > 0 and all large T,
    (Phi_n(n,c,m,p) - eps) N(T,2T) <= N_0^s(T,2T), where
    Phi_n(n,c,m,p) = (H - (n-1)(m-1)/(pm)) / (1 - c(m-(n-1))/m). At n = 7 this
    is Ainta's theorem.
    THE THREE-POINT INSTANCE IS UNCONDITIONAL. At (n,c,p) = (3, 1345/10^6,
    3000) the hypothesis is proved, not assumed: the overlap weight w = k^2 is
    enclosed from a twelve-term Taylor bound on cos and sin and the closed form
    of the kernel, and 368 interval cell lemmas over rationals, applied 1515
    times over 487 leaves, cover the quarter-plane of the two gaps. No verifier
    is trusted and no floating point appears. The cap gives m = 745 and the constant
    (149000000 H - 99200)/148800133 = 0.67273733450380946..., exceeding H by
    2.3663e-4: for Mathlib's riemannZeta, an unconditional improvement of the
    dependency's Theorem D.
    The eight-point instance stays conditional. A generalisation of Ainta's
    verifier to n points, validated by reproducing his seven-point run field for
    field, accepts c = 41763/10^7 at p = 3200, giving m = 246 and
    0.67305298298962888...; an interval-arithmetic acceptance is not a proof, so
    that hypothesis is written into the statement.
    The pair is the point of the entry: one theorem gives the largest constant
    reachable under an assumed certificate and a smaller assumption-free one
    where the certificate is small enough to prove, and the gap between them
    measures what is still owed to a verifier.
  authors: ["Thomas Lince"]
  license: "MIT"
  responsible_maintainers: ["Thomas Lince"]

classification:
  arxiv: ["math.NT"]
  msc2020: ["11M26", "15A42"]

