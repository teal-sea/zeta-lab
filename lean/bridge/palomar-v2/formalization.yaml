# formalization.yaml v0.4 for the intended Zeta Lab bridge registration.
#
# An earlier V1 attempt at commit 58bd44cadb5881540af744a152492d2c25420008
# closed without registration. This surface carries the parametric n-point
# theorem and three instances: two UNCONDITIONAL at n = 3 and n = 4, whose
# certificates are proved inside Lean, and one conditional at n = 8. Same selected project,
# lean/bridge; comparator lean/bridge/comparator-v2.json.
version: "v0.4"

project:
  name: "Zeta Lab: the n-point simple-zero bound, with unconditional three- and four-point instances"
  description: >-
    Let N(T,2T) count the nontrivial zeros of the Riemann zeta function with
    ordinate in (T,2T], with multiplicity, and N_0^s(T,2T) the simple zeros
    among them on the critical line. The Lean development accompanying
    arXiv:2608.13637 (anthropics/zeta-23-lean) proves, for Mathlib's
    riemannZeta and unconditionally, that for every eps > 0 and all large T,
    (H - eps) N(T,2T) <= N_0^s(T,2T), with
    H = 3/2 - (1/sqrt 2) cot(1/sqrt 2) = 0.67250070367941164573... (its Theorem D).
    Ainta (github.com/ainta/zeta-simple-zeros) refines H by carrying the
    spectral defect of the Gram matrix of the simple-zero vectors through that
    argument and bounding it block by block through a local inequality on seven
    points.
    Advertised here: that refinement carried out for n points at once, and three
    instances. Parametrically, for n >= 2, c > 0, m >= n, p > 0 with
    c(m-(n-1)) <= 1, if c <= F(n,p,g) for every nonnegative vector g of n-1 gaps
    (the hypothesis hCert), then for every eps > 0 and all large T,
    (Phi_n(n,c,m,p) - eps) N(T,2T) <= N_0^s(T,2T), where
    Phi_n(n,c,m,p) = (H - (n-1)(m-1)/(pm)) / (1 - c(m-(n-1))/m). At n = 7 this
    is Ainta's theorem.
    THE THREE-POINT INSTANCE IS UNCONDITIONAL. At (n,c,p) = (3, 1345/10^6,
    3000) the hypothesis is proved, not assumed: the overlap weight w = k^2 is
    enclosed from a twelve-term Taylor bound on cos and sin and the closed form
    of the kernel, and 368 interval cell lemmas over rationals, applied 1515
    times over 487 leaves, cover the quarter-plane of the two gaps. No external
    interval-arithmetic certificate is assumed for the three-point theorem, and
    no floating point appears. The cap gives m = 745 and the constant
    (149000000 H - 99200)/148800133 = 0.67273733450380945032..., exceeding H by
    2.3663e-4: for Mathlib's riemannZeta, an unconditional improvement of the
    dependency's Theorem D.
    THE FOUR-POINT INSTANCE IS ALSO UNCONDITIONAL. At (n,c,p) = (4, 2310/10^6,
    2500), the finite inequality at every triple of nonnegative gaps is proved
    inside Lean. The cap gives m = 435 and the resulting constant is
    (906250 H - 1085)/904171 = 0.67284701976668882760.... The bound and ratio
    carry no certificate hypothesis and use exactly the same three permitted axioms.
    The eight-point instance stays conditional. Our n-point generalisation of
    Ainta's interval verifier accepts c = 41763/10^7 at p = 3200, giving m = 246
    and 0.67305298298962888...; interval-arithmetic acceptance is not a Lean
    proof, so hCert remains explicit.
    The contrast is explicit in the statements: the parametric and eight-point
    theorems retain a named certificate hypothesis, while the three- and
    four-point theorems prove their certificates inside Lean.
    RELATION TO THE PUBLIC FIELD, AND WHY THE ADVERTISED UNCONDITIONAL
    CONSTANTS ARE SMALLER THAN PUBLISHED ONES. Three constants for this
    quantity are public, and two of them exceed both unconditional instances
    advertised here. The dependency's Theorem D gives
    H = 0.67250070367941164573...; Ainta's Theorem 1.1, at c = 19/5000 with
    m = 269 and p = 3000, gives 0.6730085279277797613...; and Gohms, in issue
    #1 on Ainta's repository, at c = 191/50000 with m = 267 and p = 3000, gives
    0.6730213619501665.... Both figures above H rest on an interval-arithmetic
    program accepting a finite inequality, not on a proof of it; the Gohms
    issue says as much of itself, calling the result provisional, not
    peer-reviewed and not formally verified. This laboratory reproduced both
    runs at the pinned commit 040c5e8, found that the verifier's
    compactification prune is applied without consulting the target and is
    therefore justified at Ainta's target only, re-ran both targets with the
    cutoff derived from the target instead, and reported all of it on that
    issue on 2026-08-23; every published claim survived the correction. That
    same public comment records the seven-point family's own ceiling,
    0.673029553 at p = 3400 with m = 294, and the eight-point figure
    0.673052983 that appears here as eight_point_bound. So the strongest
    constant reported in this family, as far as this laboratory knows, is the
    one advertised here, and it is precisely the one this submission leaves
    CONDITIONAL, with its certificate hypothesis and that hypothesis's numbers
    written into the statement. What is offered here is therefore not a larger
    constant. It is a different kind of evidence for one: the analytic passage
    from a finite inequality to a proportion of zeros, which every figure above
    quotes informally, is machine-checked against Mathlib's riemannZeta, and at
    n = 3 and n = 4 the finite inequality itself is proved inside Lean, so
    those two instances carry no certificate and no hypothesis at all. They are
    numerically smaller than Ainta's and Gohms's figures and they are the only
    ones in the list that are theorems about riemannZeta. No novelty is claimed
    for the n-point generalisation beyond this: no prior formalisation of it is
    known to this laboratory, and no systematic search has been performed that
    would establish that none exists.
  authors: ["Thomas Lince"]
  license: "MIT"
  responsible_maintainers: ["Thomas Lince"]

classification:
  arxiv: ["math.NT"]
  msc2020: ["11M26", "15A42"]

sources:
  - title: >-
      More than 67.3% of the zeros of the Riemann zeta function are simple and
      lie on the critical line
    authors: ["Ainta"]
    type: "paper"
    location: "https://github.com/ainta/zeta-simple-zeros"
    relationship: adapts
    note: >-
      paper/riemann.tex at commit 040c5e899e658aed7b56a2a87f501798fe10761d,
      retrieved 2026-08-22: the informal source of the argument from the finite
      inequality to the zero count. The generalisation to n points, the closed
      form Phi_n with its cap, the pinching proof, every Lean statement and
      proof, the eight-point certificate and the three- and four-point
      enclosures are this laboratory's. Not "formalizes": the theorem is
      parametric, the three- and four-point instances are unconditional where
      the paper's result is not, and several steps take routes the paper does not.
      Its reported constant is 0.6730085279277797613..., at c = 19/5000 with
      m = 269 and p = 3000, which exceeds both unconditional instances
      advertised here; its finite inequality is established by an
      interval-arithmetic search rather than by a proof, and its passage from
      that inequality to a proportion of zeros is informal. Reproduced here at
      the pinned commit 040c5e8, every search statistic matching the committed
      certificate: nodes 707901, depth 37, kernel hash. The reproduction, the
      defect found in the shared verifier and the family's measured ceiling
      were posted to that repository on 2026-08-23 under the submitter's
      GitHub account; the audit itself is in
      hunts/ainta_seven_point/TRUST-MAP.md in the submitted repository.
    license: "unknown"
    author_endorsement: "no-response"
  - title: >-
      More than two thirds of the zeta zeros are simple and on the critical line
    authors: ["L. Alpoge", "R. Furman"]
    contributors:
      - name: "Claude (Anthropic)"
        role: >-
          the official record for arXiv:2608.13637 states that the proof was
          discovered autonomously by Claude (Anthropic) and verified and
          communicated by the listed authors
    type: "paper"
    id: "arXiv:2608.13637"
    location: "https://www-cdn.anthropic.com/95c246936988e43127bc6b2ceb7077c1dad2d68e.pdf"
    relationship: background
    note: >-
      The base theorem this work refines, consumed entirely through its Lean
      development. Nothing is transcribed from its text. Its constant
      H = 0.67250070367941164573... is the figure both unconditional instances
      advertised here exceed.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: >-
      Provisional stronger 7-point certificate: F6 >= 191/50000 gives
      67.302136%
    authors: ["Gohms"]
    contributors:
      - name: "ChatGPT (OpenAI)"
        role: >-
          the issue states that the campaign behind the constant was conducted
          by prompting ChatGPT, and describes its own result as provisional,
          not peer-reviewed and not formally verified
    type: "web discussion"
    location: "https://github.com/ainta/zeta-simple-zeros/issues/1"
    relationship: background
    note: >-
      Posted 2026-08-19T03:25:43Z. Nothing in this submission depends on it; it
      is cited because it is the strongest constant reported by an outside
      group for this quantity and it exceeds both unconditional instances
      advertised here. Its figure is 0.6730213619501665..., at c = 191/50000
      with m = 267 and p = 3000, obtained by running Ainta's published verifier
      with TARGET_NUMERATOR and TARGET_DENOMINATOR changed and nothing else.
      Reproduced here at the pinned commit 040c5e8: nodes 786421, pruned
      393575, depth 43, matching the three figures the issue reports. One
      defect was found against it and reported on that issue on 2026-08-23
      under the submitter's GitHub account, with the audit in
      hunts/ainta_seven_point/TRUST-MAP.md section 5.1 of the submitted
      repository: verify_seven.py prunes any box whose gap sum reaches
      PRESSURE_CUTOFF_CELLS / GRID = 11.4 on the grounds that the linear term
      alone then gives 11.4/3000 = 19/5000, and applies that rule
      unconditionally without consulting the target, so it is justified at
      Ainta's target, at equality, and unsupported at this larger one, where
      the recorded run pruned 3087 boxes on those grounds. This does not show
      the claim false, and the claim is not disputed here: re-running with the
      cutoff derived from the target instead accepts 191/50000 at grid 4000 in
      786085 nodes at depth 43, so the published figure survives the
      correction. What it means is narrower and is the reason the distinction
      matters for this submission: the evidence for that constant, before and
      after the correction, is an interval-arithmetic program's acceptance of a
      finite inequality, and the passage from that inequality to a proportion
      of zeros is quoted informally. Neither step is a proof about
      riemannZeta. The three- and four-point instances advertised here report
      smaller constants and prove both steps.
    license: "unknown"
    author_endorsement: "no-response"

related_formalizations:
  - id: "https://github.com/anthropics/zeta-23-lean"
    relationship: builds-on
    note: >-
      Pinned at commit 3635e74826a4c1fcece7d1cd2b6fa75e43a00510 as a Lake
      dependency of the selected project. It supplies Ncount and N0simple for
      Mathlib's riemannZeta, the analytic inputs discharged for riemannZeta, the
      constant HD 1 = H, the Montgomery-Taylor window and its endgame, and the
      linear algebra. The advertised theorem is its thmD_0_simple_mult with
      HD 1 replaced by Phi_n n c m p. Nothing in it was modified, and
      three_point_bound and four_point_bound improve its Theorem D under the
      same axioms and with no certificate hypothesis.

status:
  scope: >-
    Formalized: V2Solution proves the seven advertised declarations without
    sorry against pinned Mathlib v4.33.0-rc2 and anthropics/zeta-23-lean at the
    pinned commit. V2Challenge contains seven deliberate statement placeholders.
    Each proved declaration reports exactly propext, Classical.choice and Quot.sound.
    WHICH ARE CONDITIONAL. Three of the seven carry the named hypothesis hCert:
    for every g : Fin (n-1) -> R with every g i >= 0, c <= F n p g, F being the
    n-point functional (the pressure term (1/p) sum g_i plus the n(n-1)/2
    pairwise overlap weights with coefficient 2/(n-(j-i))). n_point_bound takes
    it parametrically; the two eight-point statements take it at
    (8, 41763/10^7, 3200), where what is known is that an interval-arithmetic
    program written in Arb accepts it over 64 of 64 shards and 6 504 134 nodes,
    the run recorded under hunts/ainta_seven_point in the submitted repository.
    That is not a kernel-checked proof and no claim is made here that it is; the
    hypothesis is written into the statement, with its numbers, so the
    distinction survives every way of quoting the result.
    WHICH ARE NOT. three_point_bound, three_point_bound_ratio,
    four_point_bound and four_point_bound_ratio carry NO hypothesis. At (3,
    1345/10^6, 3000) the finite inequality is a theorem of
    Lean in this package, 368 interval cell lemmas over rationals applied 1515
    times over 487 leaves, resting on a twelve-term Taylor enclosure from
    Complex.exp_bound and the closed form of the kernel. No external
    interval-arithmetic certificate is assumed for the three-point theorem, no
    floating point is used. At (4, 2310/10^6, 2500), the finite inequality over
    every triple of nonnegative gaps is likewise a theorem of Lean in this
    package and yields (906250 H - 1085)/904171 = 0.67284701976668882760....
    native_decide appears nowhere in the package.
    The side conditions 2 <= n, n <= m, 0 < p, 0 < c and c(m-(n-1)) <= 1 are
    rational and closed by norm_num. Every analytic input, Riemann-von Mangoldt
    and the explicit formula included, is discharged inside the dependency for
    riemannZeta.
    Not formalized: the n-point inequality at n = 7 or n = 8; any numerical
    value of H beyond its closed form. NOTHING HERE BEARS ON THE RIEMANN
    HYPOTHESIS: the conclusion is a lower bound on a proportion of zeros and
    holds whether or not RH does. The base constant H is the dependency's
    theorem, not this entry's.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Zeta Lab, github.com/teal-sea/zeta-lab"
      tool_setup: >-
        Every Lean statement and proof was produced by Claude agents in Claude
        Code against this repository, under human direction and an explicit
        per-step obligation ledger, statement-first: each step's statement was
        fixed in the dependency's vocabulary before any proof was attempted, and
        leftovers became explicit hypotheses of the main theorem. The
        three- and four-point covers are emitted by generators in this
        repository and checked by Lean, not by the generators. The Harmonic Aristotle proving
        service was available under a cap and was not used.
      cost:
        wall_time: "2026-08-23"
        spend_usd: "not tracked"
        hardware: "local machine and hosted CI; no proving service"
  spend_usd: "not tracked"
  notes: >-
    Human direction, agent proof writing, kernel checking, within an AI-assisted
    computational mathematics framework operated by Thomas Lince at Zeta Lab.

fidelity:
  divergences: >-
    The formal argument follows the paper's structure; each place it departs
    from the text is recorded in hunts/ainta_seven_point/BRIDGE.md section 6.
    The kernel limit is proved at every separation; the tail passage carries the
    defect as a hypothesis at lambda = 1 rather than taking a limit over
    windows; block pinching is proved without convexity or unitary invariance;
    every o(N) in the paper is an explicit eta N in the Lean. The n-point layer
    and the proofs of the finite inequalities at n = 3 and n = 4 have no
    counterpart in the paper.

review:
  status: "self-assessed"
  notes: >-
    No external mathematical review has been performed and no person outside
    this laboratory has read the development.
    Deliberate sorry count: V2Challenge.lean carries seven sorry, one per
    advertised statement, which is what the Palomar format requires of a
    statement-only module. The development and V2Solution.lean carry none. A
    claim that this tree is sorry-free has to say which object it means, and
    this field is that statement.
    Checks: the seven advertised declarations report exactly the three standard
    axioms in a whole-package build; a static scan of every Lean file in the
    selected project finds no axiom, opaque, unsafe, admit, native_decide,
    implemented_by or extern; the Challenge's copies of the definitions are tied
    to the development's by rfl bridges in the Solution, the one exception being
    H, whose bridge is the dependency's theorem HD_one.
    Limitations: the run behind the eight-point hCert was checked by reproducing
    a third party's run and re-running a generalisation of it, not by any formal
    method; and whether this entry clears the notability floor is the registry's
    call, not a claim this file makes. Replay cost note: the selected project
    compiles the generated ThreePoint and FourPoint tables; the merged
    four-point source adds approximately 78,000 generated lines, so this replay
    is materially heavier than the earlier V2 surface.

alignment:
  namespace: "Zeta23Ext.PalomarV2"
  statements:
    - source: "Ainta, Theorem 1.1, generalised to n points. CONDITIONAL on hCert"
      lean: "Zeta23Ext.PalomarV2.n_point_bound"
      module: "V2Solution"
      status: "proved"
      note: "Zeta23Ext.Bridge.n_point_bound, in Zeta23Ext/Bridge/Main.lean."
    - source: >-
        At n = 8 and (41763/10^7, 246, 3200): at least 0.67305298298962888...
        - eps. CONDITIONAL on hCert there
      lean: "Zeta23Ext.PalomarV2.eight_point_bound"
      module: "V2Solution"
      status: "proved"
      note: "From n_point_bound, side conditions by norm_num."
    - source: >-
        The same as a proportion, no positivity guard on the denominator.
        CONDITIONAL on hCert
      lean: "Zeta23Ext.PalomarV2.eight_point_bound_ratio"
      module: "V2Solution"
      status: "proved"
      note: "From eight_point_bound and the dependency's N(T,2T) -> infinity."
    - source: >-
        At n = 3 and (1345/10^6, 745, 3000), certificate proved rather than
        assumed: at least 0.67273733450380945032... - eps. UNCONDITIONAL
      lean: "Zeta23Ext.PalomarV2.three_point_bound"
      module: "V2Solution"
      status: "proved"
      note: >-
        Zeta23Ext.Bridge.ThreePoint.three_point_bound: n_point_bound with hCert
        supplied by three_point_cert, itself proved from an enclosure of the
        kernel and 368 interval cell lemmas. Strictly stronger than the
        dependency's Theorem D, same three axioms, no hypothesis.
    - source: >-
        The same as a proportion, no hypothesis and no positivity guard on the
        denominator. UNCONDITIONAL
      lean: "Zeta23Ext.PalomarV2.three_point_bound_ratio"
      module: "V2Solution"
