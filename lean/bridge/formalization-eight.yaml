# formalization.yaml v0.4 for a Palomar Registry submission of the Zeta Lab
# formalisation of the n-POINT simple-zero bound and its EIGHT-POINT instance,
# conditional on the n-point inequality.
#
# This is a second entry over the same selected project as the seven-point
# entry (lean/bridge, comparator lean/bridge/comparator.json, namespace
# Zeta23Ext.Palomar). It advertises different declarations, in the disjoint
# namespace Zeta23Ext.PalomarEight, through its own Challenge and Solution
# modules (EightChallenge.lean, EightSolution.lean) and its own comparator
# configuration, lean/bridge/comparator-eight.json. Neither surface imports or
# modifies the other; the seven-point files are untouched by this entry.
#
# Selected project: lean/bridge, a Lake package of its own containing the whole
# advertised development and nothing else; `lake build` at its root succeeds and
# builds both surfaces.
version: "v0.4"

project:
  name: "Zeta Lab: the n-point simple-zero bound, and the eight-point case"
  description: >-
    Let N(T,2T) count the nontrivial zeros of the Riemann zeta function with
    ordinate in (T,2T], with multiplicity, and N_0^s(T,2T) the simple zeros on
    the critical line in that range. The Lean development accompanying
    arXiv:2608.13637 (anthropics/zeta-23-lean) proves, for Mathlib's
    riemannZeta and unconditionally, that for every eps > 0 and all large T,
    (H - eps) N(T,2T) <= N_0^s(T,2T) with
    H = 3/2 - (1/sqrt 2) cot(1/sqrt 2) = 0.6725007036794116... (its Theorem D).
    Ainta (github.com/ainta/zeta-simple-zeros, paper/riemann.tex, August 2026)
    refines this by carrying the spectral defect D(M) = tr Psi(M) of the Gram
    matrix of the simple-zero vectors through that argument, bounding it block
    by block through a local inequality on SEVEN points, and solving for the
    proportion. This entry advertises that refinement carried out for n POINTS,
    for every n >= 2 at once, and instantiated at n = 8.
    The principal advertised statement is: for every natural n >= 2, real
    c > 0 and naturals m >= n, p > 0 with c(m-(n-1)) <= 1, if c <= F n p (g)
    for every nonnegative (n-1)-gap vector g (the hypothesis hCert), then for
    every eps > 0 and all large T,
    (Phi_n(n,c,m,p) - eps) N(T,2T) <= N_0^s(T,2T), where
    Phi_n(n,c,m,p) = (H - (n-1)(m-1)/(pm)) / (1 - c(m-(n-1))/m) and
    F n p (g) = (1/p) sum_i g_i + sum over the n(n-1)/2 pairs i < j of the n
    points y_0 = 0, y_i = g_0 + ... + g_{i-1} of (2/(n-(j-i))) w(y_j - y_i),
    with w = k^2 and k the Montgomery-Taylor overlap kernel K(x)/K(0).
    What the generalisation resolves. The seven-point argument carries two
    numerals that the paper writes as constants: the 6 in the numerator of Phi
    and the m-6 in its denominator. In the Lean proof the first is the number of
    times a single gap is charged when the pressure term is summed over the
    windows of a block, which is n-1 (Ainta's line "each single gap occurs at
    most six times"), and the second is the number of windows of n consecutive
    points in a block of m, which is m-(n-1). The block cap A_0 = c(m-(n-1))
    <= 1 caps m at (n-1) + floor(1/c). At n = 7 every object reduces
    definitionally to the seven-point one (F 7 p is Ainta's F6 p by rfl,
    Phi_n 7 is Phi by norm_num) and the statement is his Theorem 1.1 in its
    parametric form, unchanged; the seven-point entry over this same project
    advertises exactly that.
    The two instantiated statements take n = 8 at the eight-point certificate
    this laboratory's own interval-arithmetic run accepts, c = 41763/10^7 at
    p = 3200: 64 of 64 shards, 6 504 134 nodes, minimiser the palindrome
    (1.046, 1.989, 1.987, 1.042, 1.987, 1.989, 1.046), and Arb at the argmin
    bracketing the infimum as 0.0041763 <= inf F 8 3200 <= 0.0041773221. The cap
    c(m-7) <= 1 gives m <= 7 + floor(10^7/41763) = 246, and at m = 246 the
    constant is (2460000000 H - 5359375)/2450018643 = 0.67305298298962888...,
    against 0.67302955347969271... at this laboratory's best seven-point
    parameters and 0.67300852792777976... at Ainta's published ones. The second
    of the two states the conclusion as a bound on the ratio
    N_0^s(T,2T)/N(T,2T), with no positivity guard on the denominator, which is
    the form the result is usually quoted in. All three advertised statements
    are conditional on hCert at their own parameters.
    What the work consists of. Every step of the argument between the finite
    inequality and the zero count is a Lean theorem with standard axioms, and
    every one of them is stated at n points: the stability rank-trace
    inequality, the regrouping of the normalised matrix into the simple-zero
    factor and a complement of bounded positive index, the counting inequality
    with defect, the tail passage at the lambda = 1 window, the uniform-in-T
    limit of the Gram entries to the overlap kernel, the o(N) count of zeros in
    the deleted end strips, the block energy, block defect and block bound
    lemmas, block pinching for convex trace functionals, the averaging over
    block starts, and the final linear solve. Seven of the sixteen steps turned
    out to be independent of the point count already, being stated for abstract
    Hermitian matrices or for an abstract block constant; the point count enters
    only the block energy step (a fibre-cardinality bound n-r in place of 7-r),
    the finite telescoping helpers, and the tolerance bookkeeping of the final
    assembly, where the paper's eta = min(eps/10, A_0) is sound at n = 7 only
    because the accumulated coefficient m + 3 + (n-1)(m-1) is then at most 10m,
    and is replaced here by eta = min(eps m / (m + 3 + (n-1)(m-1)), A_0).
    The hypothesis hCert is the paper's Proposition 4.1 at n = 7 and this
    laboratory's eight-point run at n = 8; it is not formalised at either, it is
    named in the statements and nowhere else.
    Audience. Analytic number theorists working on simple zeros and zeros on
    the critical line, for whom the question is which finite inequality a
    published proportion actually rests on and what a further point buys: the
    theorem exposes that dependence as a single named hypothesis, makes the
    constant a closed-form function Phi_n of the point count and the
    certificate parameters, and so turns "add a point" into an arithmetic
    question about a certificate rather than a reworking of an analytic
    argument. What the theorem asserts is bounded by the scope field: it is
    conditional on hCert, and it is evidence for nothing about the Riemann
    Hypothesis.
    Relation to the other entry over this same selected project. The
    seven-point entry (comparator lean/bridge/comparator.json, namespace
    Zeta23Ext.Palomar) advertises Ainta's Theorem 1.1 in parametric form and
    three instantiations of it; its four declarations are the n = 7 case of
    this entry's first declaration, and in the development its
    seven_point_bound is three lines on top of n_point_bound. The two surfaces
    are separate files in disjoint namespaces, neither importing the other, and
    this entry changes nothing in that one. A reader auditing only one should
    audit the seven-point entry, which advertises the statement a published
    constant is quoted from; this entry is the general theorem and the point
    count no published argument reaches.
  authors:
    - "Thomas Lince"
  license: "MIT"
  responsible_maintainers:
    - "Thomas Lince"

