status:
  scope: >-
    Formalized: the three advertised declarations, sorry-free, against pinned
    Mathlib v4.33.0-rc2 and anthropics/zeta-23-lean at the pinned commit, with
    #print axioms reporting exactly propext, Classical.choice and Quot.sound
    for each of the three.
    CONDITIONAL, AND THE CERTIFICATE IS A HYPOTHESIS, NOT A LEAN FACT.
    n_point_bound takes the named hypothesis hCert, which says: for every
    g : Fin (n-1) -> R with every g i >= 0, c <= F n p g, where F is the
    n-point functional (the pressure term (1/p) sum g_i plus the n(n-1)/2
    pairwise overlap weights w(y_j - y_i) = k(y_j - y_i)^2 with coefficient
    2/(n-r) for a pair spanning r gaps). At n = 7 this is the paper's
    Proposition 4.1. What is known about it is that an interval-arithmetic
    program written in Arb accepts it: at (n, c, p) = (7, 19/5000, 3000) in the
    published run at github.com/ainta/zeta-simple-zeros, which this laboratory
    reproduced field for field; at (7, 34697/10^7, 3400) in this laboratory's
    own seven-point run; and at (8, 41763/10^7, 3200) in this laboratory's
    eight-point run, which used a generalisation of the published verifier to n
    points, validated first by forcing it to the original cutoff at n = 7 and
    reproducing that run bit for bit (707 901 nodes, 93 735 tangent prunes,
    both table hashes) and by agreeing with a brute-force scan at n = 3. All
    three runs are recorded under hunts/ainta_seven_point in the submitted
    repository, with node counts, shard counts and artifacts. A verifier's
    acceptance is not a kernel-checked proof and no claim is made here that it
    is; re-enclosing the underlying sinc table inside Lean is a separate
    project of a different size. The hypothesis is written into every advertised
    statement, with its numbers in the two instantiated ones, rather than
    assumed as an axiom, exactly so that this distinction survives every way of
    quoting the result.
    Each statement also takes hA0 : c(m-(n-1)) <= 1, a rational side condition,
    and the side conditions 2 <= n, n <= m, 0 < p, 0 < c; in the two
    instantiated statements all five are discharged by norm_num, leaving hCert
    as the only hypothesis. Every other input, including the Riemann-von
    Mangoldt formula and the explicit formula, is discharged inside the
    dependency for riemannZeta.
    Non-vacuity of the hypothesis: F n p 0 = n(n-1)/2 * (2/(n-r)) summed over
    the pairs, which is positive, and F n p g >= (1/p) sum g_i, so the class of
    (n, c, p) satisfying hCert is nonempty; what the certificate supplies is the
    specific value, and the theorem's interest is proportional to that value.
    The difference between the eight-point constant and the seven-point one is a
    difference of assumed certificate and point count, not of proved
    mathematics: one parametric theorem, instantiated twice.
    Not formalized, and deliberately outside the advertised statements: the
    n-point inequality itself, at any parameter set (at n = 8 a branch-and-bound
    search of 6 504 134 nodes over 64 shards, on top of an interval table); the
    claim that 246 is optimal or that the eight-point certificate is sharp (the
    Arb bracket 0.0041763 <= inf F 8 3200 <= 0.0041773221 is what is known); the
    nine-point case, whose float floor this laboratory located but did not
    verify; the Gohms variant at 191/50000 and the other certificate targets the
    hunt explored; any numerical value of H beyond its closed form. NOTHING HERE
    BEARS ON THE RIEMANN HYPOTHESIS: the conclusion is a lower bound on a
    proportion of zeros and holds whether or not RH does. The base constant H is
    the dependency's theorem, not this submission's, and the seven-point
    argument this generalises is Ainta's, not this submission's.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Zeta Lab, github.com/teal-sea/zeta-lab"
      tool_setup: >-
        The sixteen-step decomposition, every Lean statement and every proof
        were produced by Claude agents running in Claude Code against this
        repository: one agent wrote the end-to-end seven-point skeleton with
        the eleven unproved steps as named lemmas carrying sorry and their
        residual goals in words, four agents then closed them in parallel on
        disjoint files, and one agent integrated, built and audited. A further
        agent pass packaged that result for this registry as the seven-point
        entry. A further agent pass then made every step of the development
        parametric in the point count n, proved n_point_bound, derived
        seven_point_bound from it with its statement unchanged, and added the
        n = 8 instance; and a final pass authored the Challenge and Solution
        modules of this entry. The Harmonic Aristotle service was available
        under a cap of three submissions per agent and was not used: zero of
        fifteen, because every obligation closed locally before a residual
        existed (lean/ARISTOTLE-RUNS.md, Batch 12). The eight-point certificate
        run was executed on Modal, 64 shards, from a generalisation of the
        published Python verifier; it is an input to the hypothesis and not
        part of the Lean. No step uses native_decide and no step uses floating
        point.
      cost:
        wall_time: >-
          The skeleton, the five attack branches and the integration ran on
          2026-08-23, one working day, following a trust-map pass on
          2026-08-22 and the S2 probe earlier on 2026-08-23; the eight-point
          verifier run, the parametric generalisation and this surface followed
          on the same day. A warm rebuild of the whole package is 8864 jobs and
          about a minute.
        spend_usd: "not tracked"
        hardware: >-
          local machine for the Lean; Modal for the eight-point certificate
          search, 64 shards, 6 504 134 nodes, 2 699 s; no proving service
      prompting_notes: >-
        Statement-first, as for the laboratory's earlier submissions: the
        skeleton fixed each step's Lean statement in the dependency's own
        vocabulary, each attacker was told to leave anything unproved as a
        named lemma with its residual goal in words, and the integrator was
        told to turn leftovers into explicit hypotheses of the main theorem.
        None were left. The generalisation pass was told to keep the
        seven-point definitions and the seven-point statement byte-identical,
        so that the entry already submitted from this project could not move
        under it, and to report which steps needed real work rather than
        reporting a diff.
  spend_usd: "not tracked"
  notes: >-
    Human direction, agent proof writing, kernel checking, and an explicit
    obligation ledger per attack group under hunts/ainta_seven_point/bridge/.
    The single non-Lean input is carried as a named hypothesis of every
    advertised theorem so that the conditional result cannot be read as an
    unconditional one. The interval-arithmetic runs behind that hypothesis were
    executed by this laboratory and are recorded, with node and depth counts
    and their artifacts, in hunts/ainta_seven_point/RUNS.md and RESULTS.md;
    they are evidence for the hypothesis, not a proof of it. The derivations
    were directed and verified within an AI-assisted computational mathematics
    framework operated by Thomas Lince at Zeta Lab.

fidelity:
  divergences: >-
    The formal argument follows the paper's structure at n = 7 and departs from
    its text in the following places, each recorded in
    hunts/ainta_seven_point/BRIDGE.md section 6. The kernel limit (Lemma 3.1)
    is proved for every pair of retained zeros at every separation; the paper's
    bounded-separation parameter R_0 is kept in the signature but is not used.
    The tail passage (Corollary 2.2) does not pass through the dependency's
    limit over windows lambda -> 1; it re-states two of the dependency's
    endgame lemmas at lambda = 1 with the defect carried as a hypothesis, which
    their own inputs permit. Block pinching (eq:pinching) is proved without
    convexity of the matrix functional or unitary invariance, from the
    row-stochastic mixture of the spectrum of a principal submatrix and scalar
    Jensen. The block defect lemma (Lemma 4.3) is proved for every Hermitian
    matrix, positivity unused. The block energy lemma (Lemma 4.2) is proved as a
    fibre count plus an exact telescoping identity, both needing w even. The
    block bound (eq:269block) uses |k| <= 1, which the paper does not state and
    which holds because cos(sqrt 2 t) >= 0 on [-1/2, 1/2]; its error term is
    2 m^2 delta rather than an unquantified o(1). The averaging of section 5 is
    over all n-m+1 block starts with one pinching partition per residue class
    rather than over m offsets with a floor count. The span bound
    x_{S} - x_1 <= N + o(N) uses L <= l_1 and log T = o(T), neither stated in
    the paper. Every o(N) in the paper is an explicit eta N in the Lean,
    consumed as an eventually-in-T statement.
    Beyond those, and specific to this entry: the paper is written at seven
    points and this development is written at n points. The paper's constant 6
    is the per-gap charge n-1 and its m-6 is the window count m-(n-1); the
    fibre-cardinality bound of the block energy step is n-r where the paper's
    is 7-r; and the tolerance eta = min(eps/10, A_0) of the final assembly,
    which is sound at n = 7 because the accumulated coefficient
    m + 3 + (n-1)(m-1) is then at most 10m, is replaced by
    eta = min(eps m / (m + 3 + (n-1)(m-1)), A_0), which is sound at every n.
    That substitution is the one genuine mathematical change the generalisation
    required; everything else in the assembly turned out to be independent of
    the point count given the two derived reals. At n = 7 every advertised
    object reduces to the paper's definitionally or by norm_num, and the
    seven-point statement in this repository is byte-identical to the one that
    predates the generalisation.

review:
  status: "self-assessed"
  notes: >-
    No external mathematical review has been performed, and no person outside
    this laboratory has read the development. "self-assessed" means exactly
    that: the checks below were run by the laboratory on its own work.
    Packaging state. The advertised development lives in its own Lake package,
    lean/bridge, which requires anthropics/zeta-23-lean at the pinned commit
    and whose root module imports every module in it; `lake build` at that root
    completes with 8864 jobs and zero errors, and builds both submission
    surfaces. The Challenge and Solution modules named by
    lean/bridge/comparator-eight.json exist: EightChallenge.lean states the
    three advertised theorems over Mathlib alone, in the namespace
    Zeta23Ext.PalomarEight, restating verbatim the five counting definitions of
    the dependency's Zeta23/Statement.lean and the five kernel and n-point
    definitions of Zeta23Ext/Bridge/Defs.lean, and writing the constant H in
    the closed form the dependency's HD_one proves equal to its HD 1;
    EightSolution.lean proves the same three from Zeta23Ext.Bridge.Main through
    those bridges, every one of which is rfl except H_eq, which is HD_one, and
    Phi_n_eq, which carries H_eq into the constant.
    Relation to the seven-point entry over the same project. That entry's
    status.scope says the eight-point generalisation was stated and not proved
    and is not offered there. That was true when it was written and is the
    reason this is a separate entry rather than an edit: the eight-point bridge
    is now proved, in this surface, and the seven-point surface is unchanged
    down to the byte. A reviewer comparing the two should expect the
    seven-point entry's sentence about the eight-point case to be superseded by
    this entry and by nothing else.
    Deliberate sorry count. The Challenge module carries three sorry, one per
    advertised statement, which is what the Palomar format requires of a
    statement-only module. The development and the Solution module carry none:
    a whole-package build reports exactly seven `declaration uses sorry`
    warnings, four in BridgeChallenge.lean and three in EightChallenge.lean,
    and none anywhere else. Any claim that this tree is sorry-free has to say
    which object it means, and this field is that statement.
    Internal checks performed and recorded: the three advertised declarations
    and the other audited declarations in the package report exactly propext,
    Classical.choice and Quot.sound under #print axioms in one whole-package
    build (some print Classical.choice as choice, because Classical is open in
    the module that emits them); a static scan of every Lean file in the
    package finds no axiom, opaque, unsafe, admit, native_decide,
    implemented_by or extern; the closed rational form of the eight-point
    constant is a kernel-checked theorem of the development (Phi_lab8) and not
    a hand computation, and its decimal was recomputed independently at 50
    digits; the cap m = 246 is discharged by norm_num inside the theorem and
    was checked exactly in rational arithmetic (c(246-7) = 9981357/10^7 <= 1,
    c(247-7) = 1.002312 > 1); and the hypothesis hCert is named in every
    advertised statement and in status.scope, so no reading of this entry can
    take the result as unconditional.
    Known limitations of this self-assessment: the interval-arithmetic runs
    behind hCert were checked by reproducing a third party's run and by
    validating a generalised verifier against it, not by any formal method; the
    eight-point run has not been reproduced by anyone else and no third party
    has an eight-point certificate to compare against; the constants inside the
    proofs are not sharp and were not tuned; the source is an unrefereed draft
    by a pseudonymous author; and whether a conditional refinement of a theorem
    already registered from the upstream repository, at a point count no
    published argument treats, clears this registry's notability floor is the
    registry's call, not a claim this file makes for it.

