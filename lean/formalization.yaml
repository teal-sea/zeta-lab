# formalization.yaml v0.4 for the Palomar Registry submission of the
# Zeta Lab source-admissible strong closure.
version: "v0.4"

project:
  name: "Zeta Lab: source-admissible strong closure for the F1 window functional"
  description: >-
    A variational identity for the Fredholm operator A = I + T on the interval
    I = [-1/2, 1/2], where T is convolution against the Farmer-Gonek-Lee
    pair-correlation form factor F1(x) = |x| - 4x^2 + sum_k a_k |x|^(2k+3) with
    a_k = 2^(2k+3) k! / (2k+2)!. Let w = A^(-1)1 and c* = <1, A^(-1)1>. Over the
    source-admissible class of scalar profiles v(s) = phi(Ls)^2 induced by even,
    radially nonincreasing C^2 windows supported exactly on [-L/2, L/2] with
    0 <= phi <= 1 and uniform L^1 bounds on phi'' and (phi^2)'', the supremum of
    <1,v>^2 / <Av,v> equals c*, and the infimum of the reciprocal quotient
    <Av,v> / <1,v>^2 equals 1/c*.
    The upper bound <1,v>^2 <= c* <Av,v> is energy Cauchy-Schwarz. It holds for
    every v, it is classical, and it is not the content of this result. The
    content is the reverse inequality over the constrained class: c* is the
    value of the unconstrained variational problem, and the identity says that
    imposing evenness, radial monotonicity, an exact compact support, the
    amplitude ceiling 0 <= phi <= 1 and uniform L^1 bounds on the second
    derivatives does not lower the supremum. That direction is proved by
    exhibiting an explicit endpoint-tapered family inside the class, indexed by
    the scale L, whose quotient converges to c*. Both orientations are
    advertised because the orientation is load-bearing: it is the quotient with
    <1,v>^2 in the numerator whose supremum is c*, and the supporting
    development also proves that the two are not interchangeable. The advertised
    statement is existential in the profile and in the two uniform constants, so
    it carries its own non-vacuity: an IsLUB or IsGLB assertion over the image
    of an empty class is unsatisfiable in the reals, so the theorem cannot hold
    unless the class is populated by the constants for which it is stated.
    Audience. The kernel F1 is the pair-correlation form factor and the window
    class is the generalized, load-bearing class of Section 7.1 of the cited
    paper rather than a convenient flat-topped realization, so the constrained
    supremum settled here is the quantity that a critical-line proportion
    argument built on that framework optimizes; analytic number theorists
    working on the proportion of zeros of the Riemann zeta function on the
    critical line, and on pair correlation of its zeros, are the audience for
    which the exact value of that supremum over the admissible class, rather
    than a bound on it, is the relevant fact. The statement is also a closure
    result for a constrained admissible class in the variational theory of
    Fredholm integral operators (MSC 45B05, 49R05) and can be read there
    without reference to its origin. What the theorem itself asserts is bounded
    by the scope field below: it is a statement about a Fredholm operator on an
    interval and a class of test profiles, and it is evidence for nothing
    beyond that.
  authors:
    - "Thomas Lince"
  license: "MIT"
  responsible_maintainers:
    - "Thomas Lince"

classification:
  arxiv: ["math.NT", "math.CA"]
  msc2020: ["45B05", "49R05", "11M26"]

sources:
  - title: >-
      Source-admissible strong closure for the Farmer-Gonek-Lee window
      functional: the supremum of <1,v>^2/<Av,v> over the compactly supported
      monotone admissible class is exactly <1, A^(-1)1>
    type: original-proof
    relationship: other
    note: >-
      The identity is a result of this laboratory. The cited paper below
      supplies the setting that is analyzed, namely the form factor, the
      admissible window class and the induced scalar profile; it does not state
      or prove this supremum identity. An informal companion note by the same
      author, "The Optimal Bandwidth-One Window Functional for the xi-prime
      Pair-Correlation Method" (Zeta Lab, August 2026), presents the same
      mathematics and names these Lean declarations in its formal-verification
      section; at the time of this submission that note is in preparation and
      not yet publicly posted. Originality here is a claim about provenance
      only. No literature search for prior art on this identity has been run and
      no claim of novelty is made.
  - title: >-
      More than two thirds of the zeta zeros are simple and on the critical line
    authors:
      - "L. Alpoge"
      - "R. Furman"
    contributors:
      - name: "Claude (Anthropic)"
        role: >-
          the official record for arXiv:2608.13637 states that the proof was
