status:
  scope: >-
    Formalized: the three advertised declarations, unconditionally against
    pinned Mathlib v4.33.0-rc2. pub1_strong_closure and
    pub1_strong_closure_reciprocal assume only IsProfile w, which says that w is
    a bounded continuous solution of Aw = 1, that is, it names the object the
    statement is about rather than imposing a further condition on it.
    pub1_strong_closure_exists carries no hypothesis at all, so no advertised
    statement can be vacuous.
    Not formalized, and deliberately outside the advertised statements. The
    attained maximum over the wider C^2(I) profile class is not itself a
    formalized statement; only the supremum over the stricter class is, and over
    that class the value is approached and not attained. The formalized
    regularity statement is second-order differentiability of w on the open
    interval (-1/2, 1/2); the upgrade to the closed interval used for attainment
    in the informal companion note is a short classical mean-value argument and
    is not formalized. Nothing here formalizes any statement about the Riemann
    zeta function, its zeros, the proportion of zeros on the critical line, or
    the Riemann Hypothesis, and the cited paper's realization theorem is neither
    used nor reproved. No numerical value, enclosure or certificate for c* is
    part of any advertised statement; the exact-rational certificates in the
    repository are separate artifacts and are not submitted here. Lean does not
    verify the interpretation of the Farmer-Gonek-Lee form factor, historical
    attributions, or novelty relative to the literature.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)", "Aristotle (Harmonic)"]
      framework: "Zeta Lab, github.com/teal-sea/zeta-lab"
      tool_setup: >-
        The mathematical decomposition and every Lean statement were specified
        by the laboratory. Proofs of the named subgoals were machine-found
        through the Harmonic Aristotle service and checked by the Lean kernel;
        the modules under ZetaLean/Pub1/Aristotle/ are what that service
        returned. Assembly, auditing, obligation tracking and this
        Challenge/Solution submission surface were done by Claude agents running
        in Claude Code against this repository. No step uses native_decide and
        no step uses floating point.
      cost:
        wall_time: >-
          The development ran across agent sessions from 2026-08-12 to
          2026-08-16, when the last of its four analytic obligations was
          discharged and the result became unconditional. The Palomar submission
          surface was added on 2026-08-21.
        spend_usd: "not tracked"
        hardware: "local machine plus hosted API services"
      prompting_notes: >-
        The working pattern was statement-first: the laboratory fixed each Lean
        statement and its hypotheses, then requested a proof of exactly that
        statement, then audited what came back. On a neighbouring item the same
        service refuted a hypothesis gap in the laboratory's own submission by
        exhibiting a counterexample, which ships in the tree rather than being
        removed.
  spend_usd: "not tracked"
  notes: >-
    Human direction, machine proof search, kernel checking, and an explicit
    obligation ledger. Every analytic fact the argument consumes was carried as
    a named field of the StrongClosureData interface until it was discharged, so
    that a conditional result could not be read as an unconditional one. The
    status of that interface is tracked in ZetaLean/Pub1/OBLIGATIONS.md. The
    derivations and computations supporting these results were directed and
    verified within an AI-assisted computational mathematics framework operated
    by Thomas Lince at Zeta Lab.

fidelity:
  divergences: >-
    The formalization is not a literal transcription of the L^2 Fredholm
    presentation used in the informal companion note, and the differences are
    deliberate. It works with continuous functions on I under the pairing given
    by the integral over I rather than on an L^2 quotient space; completeness is
    never needed, since the Cauchy-Schwarz half is algebra and the limit half
    needs only boundedness. It obtains w by a Banach fixed point rather than by
    inverting an operator on that quotient space. It derives the interior
    second-derivative identity by splitting the integral at t = s rather than
    through distribution theory. These are mathematically equivalent
    formulations of the same argument, chosen to avoid formalizing quotient-space
    machinery the proof does not require.
    One further modelling choice is internal to the development: the defining
    equation for the profile is stated with a clamped kernel,
    clampedKernel s t = F1(clamp s - clamp t), which on I x I is exactly
    F1(s-t) and off I repeats the boundary values. F1 is not entire and its row
    mass is bounded by 4/9 only for s in I, while the Schur and Banach
    fixed-point lemmas require a hypothesis holding for every real s. The
    clamped kernel makes those lemmas applicable without changing the quadratic
    form or the equation on I.

review:
  status: "self-assessed"
  notes: >-
    No external mathematical review has been performed. Internal checks that
    were performed and are recorded in the repository: the development is
    sorry-free and uses no theorem-specific axioms, and each advertised
    declaration was confirmed by #print axioms to depend on exactly propext,
    Classical.choice and Quot.sound; the four analytic obligations of the
    StrongClosureData interface are tracked individually in
    ZetaLean/Pub1/OBLIGATIONS.md and each is discharged; the advertised
    existential form is quantified over every parameter so that it cannot be
    vacuous; and a stale status row that understated this item's grade for three
    days was corrected in the open rather than swept, as recorded in
    docs/27-state-of-the-transplant.md.
    On the submission surface itself: Challenge.lean imports Mathlib alone and
    restates the needed definitions verbatim in a fresh namespace, Solution.lean
    reproduces that definition block byte for byte before bridging it to the
    development, and the three advertised statements are textually identical in
    the two modules.
    The mathematics under lean/ at the submitted commit is unchanged from the
    tree pinned by the informal companion note, which cites this repository at
    tag xi-prime-ceiling-support-v1, commit
    197cee922270a3ceba7c21de0a21dd816a29adad. Between that commit and the
    submitted one the only file changed under lean/ is
    ZetaLean/HardyRamanujantheorem.lean, which is not in the import closure of
    any advertised declaration.

alignment:
  namespace: "ZetaLean.Palomar"
  statements:
    - source: >-
        Source-admissible strong closure, supremum orientation, for an
        arbitrary profile w
      lean: "ZetaLean.Palomar.pub1_strong_closure"
      module: "Solution"
      status: "proved"
      note: >-
        Universally quantified in w, with IsProfile w as the hypothesis fixing
        which w is meant rather than a further condition on it. In the
        development this is ZetaLean.Pub1.pub1_strong_closure.
    - source: >-
        Source-admissible strong closure, reciprocal orientation, for an
        arbitrary profile w
      lean: "ZetaLean.Palomar.pub1_strong_closure_reciprocal"
      module: "Solution"
      status: "proved"
      note: >-
        The other orientation, advertised because the orientation is
        load-bearing and the supporting development also proves that the two
        are not interchangeable. In the development this is
        ZetaLean.Pub1.pub1_strong_closure_reciprocal.
    - source: >-
        Source-admissible strong closure, both orientations, with the profile
        and the uniform constants existentially quantified
      lean: "ZetaLean.Palomar.pub1_strong_closure_exists"
      module: "Solution"
      status: "proved"
      note: >-
        The hypothesis-free form: it additionally asserts that a profile
        exists, so it is not implied by the two above, which are quantified
        over w. In the development this is
        ZetaLean.Pub1.pub1_strong_closure_exists; the Solution module restates
        each of the three over its own verbatim copies of the definitions and
        discharges them.
