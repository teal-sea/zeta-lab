# formalization.yaml v0.4 for the Palomar Registry submission of the Zeta Lab
# Davenport-Heilbronn zero criterion and analytic half.
version: "v0.4"

project:
  name: "Zeta Lab: certified zero-existence and the analytic half of Davenport-Heilbronn"
  description: >-
    Davenport and Heilbronn (1936) exhibited a Dirichlet series with real
    coefficients satisfying a Riemann-type functional equation which
    nevertheless has zeros off the critical line. It is the standard
    demonstration that a functional equation of Riemann type does not on its
    own force the Riemann Hypothesis, and the location of its zeros remains an
    active subject. The function is
    DH(s) = (1 - i*kappa)/2 * L(s, chi) + (1 + i*kappa)/2 * L(s, chi^-1)
    for a quartic Dirichlet character chi mod 5 and
    kappa = (sqrt(10 - 2*sqrt 5) - 2)/(sqrt 5 - 1), the value that rotates the
    two conjugate root numbers onto each other and so makes the Dirichlet
    coefficients real.
    This submission advertises three theorems. The first two are a
    minimum-modulus criterion: if an entire f has strictly smaller norm at the
    centre of a disk than the bound it satisfies on the boundary sphere, then f
    has a zero in the closed disk, and the same holds with the disk replaced by
    any bounded open set and the sphere by its frontier. The proof applies
    Mathlib's maximum-modulus principle to 1/f; no argument principle and no
    winding numbers are used. The point of the criterion is that the exact
    location of a zero of an entire function cannot be certified by evaluating
    the function anywhere, however precisely, whereas a strict inequality
    between one central value and a boundary bound does certify that a zero is
    enclosed. The general boundary form is the one a certified numerical search
    can consume, because for an axis-aligned rectangle the frontier is four
    segments, which is the shape interval arithmetic discharges. Mathlib
    carries the maximum-modulus principle in many forms but, as far as the
    authors could determine, no statement concluding that a zero exists.
    The third theorem is the analytic half of the Davenport-Heilbronn theorem:
    there exists an entire function represented by the Davenport-Heilbronn
    Dirichlet series on Re z > 1 whose completion
    (pi/5)^(-(s+1)/2) * Gamma((s+1)/2) * f(s) is symmetric under s -> 1-s. It
    is existential in f, so it carries its own non-vacuity and needs none of
    the character theory used to construct the witness.
    Audience. The Davenport-Heilbronn function is a named object of analytic
    number theory with a continuing literature on its zeros, so the analytic
    half is of direct interest to number theorists working on zeros of
    L-functions and on what a Riemann-type functional equation does and does
    not imply. The zero criterion is independently reusable by anyone
    formalizing a numerical existence proof for a holomorphic function, since
    it is the step that converts a finite certified evaluation into a
    mathematical existence statement.
    Scope. The Davenport-Heilbronn theorem itself is NOT proved here. Its full
    statement additionally requires a zero s with Re s different from 1/2, and
    that conjunct appears in none of the three advertised theorems. What is
    offered is the analytic half together with a general criterion under which
    a finite certified evaluation would supply the missing half. Discharging
    that criterion for this function is a numerical obligation this submission
    does not carry, and no numerical enclosure for any zero of DH is asserted.
  authors:
    - "Thomas Lince"
  license: "MIT"
  responsible_maintainers:
    - "Thomas Lince"

classification:
  arxiv: ["math.NT", "math.CV"]
  msc2020: ["11M26", "11M41", "30C15"]

sources:
  - title: >-
      On the zeros of certain Dirichlet series
    authors:
      - "H. Davenport"
      - "H. Heilbronn"
    type: "paper"
    location: "J. London Math. Soc. 11 (1936), 181-185 and 307-312"
    relationship: "formalizes"
    note: >-
      The source constructs the function and establishes both its analytic
      properties and the existence of zeros off the critical line. This
      formalization covers the analytic half only: the existence of an entire
      function with the stated Dirichlet series representation and functional
      equation. The off-line zero, which is the substance of the source's
      theorem, is not formalized here. The definition formalized matches the
      standard one in the subsequent literature, including the value of kappa.
    license: "unknown"
    author_endorsement: "n/a"
  - title: >-
      The minimum-modulus principle for holomorphic functions, as a
      consequence of the maximum-modulus principle applied to the reciprocal
    type: "folklore"
    relationship: "background"
    note: >-
      The first two advertised theorems are a form of a classical fact of
      complex analysis and no novelty is claimed for their mathematical
      content. They are recorded here because Mathlib supplies the
      maximum-modulus principle but, as far as the authors could determine, no
      statement concluding the existence of a zero, and because the boundary
      version stated over an arbitrary bounded open set is the form a certified
      numerical search consumes. No systematic literature search for prior
      statements of this exact form has been run, and novelty is not claimed.

status:
  scope: >-
    Formalized: the three statements advertised in DHChallenge.lean,
    unconditionally. Those are the minimum-modulus criterion on a disk, the
    same criterion over an arbitrary bounded open set and its frontier, and the
    existence of an entire function satisfying the Davenport-Heilbronn series
    representation on Re z > 1 together with the completed functional equation.
    Not formalized, and deliberately outside every advertised statement: the
    existence of a zero of the Davenport-Heilbronn function off the critical
    line, and therefore the Davenport-Heilbronn theorem itself; any numerical
    enclosure, interval evaluation or certificate for any zero; and any
    statement about the Riemann zeta function or the Riemann Hypothesis.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Zeta Lab, github.com/teal-sea/zeta-lab"
      tool_setup: >-
        Every Lean statement was specified by the laboratory and the proofs were
        written and audited by Claude agents running in Claude Code against this
        repository. Unlike some other modules of this laboratory, no external
        theorem-proving service was used for the Davenport-Heilbronn
        development. No step used native_decide and no step used floating point.
      cost:
        spend_usd: "not tracked"
        hardware: "local machine plus hosted API services"
  spend_usd: "not tracked"
  notes: >-
    The functional-equation half reduces to a root-number identity, and the
    convention-sensitive steps are derived in the development rather than
    remembered, from Mathlib's Real.cos_pi_div_five by radical algebra. The
    development records explicitly which half of the Davenport-Heilbronn
    theorem is certified and which remains a numerical obligation.

fidelity:
  divergences: >-
    One deliberate modelling choice, documented at the point of use. The
    functional equation is stated with explicit guards
    Complex.Gamma ((z+1)/2) != 0 and Complex.Gamma ((1-z+1)/2) != 0. These
    exclude exactly the points at which Mathlib's junk value Gamma = 0 would
    make the unrestricted equation false; away from them both sides are the
    honest completed function. Without the guards the statement would be false
    for reasons having nothing to do with the mathematics.

review:
  status: "self-assessed"
  notes: >-
    No external mathematical review has been performed. Internal checks
    recorded in the repository: the tree is sorry-free and axiom-clean against
    pinned Mathlib v4.33.0-rc2; the definitions in DHChallenge.lean are
    verbatim copies of the development's own definitions and the DHSolution
    module reproduces that definition block before bridging it; and the
    advertised statements were chosen so that none of them contains the
    off-line-zero conjunct, so that the analytic half cannot be read as the
    full theorem.

alignment:
  namespace: "ZetaLean.PalomarDH"
  statements:
    - source: "Minimum-modulus criterion on a disk"
      lean: "ZetaLean.PalomarDH.exists_zero_of_norm_lt_on_sphere"
      module: "DHSolution"
      status: "proved"
      note: >-
        In the development this is ZetaLean.DH.exists_zero_of_norm_lt_on_sphere.
    - source: "Minimum-modulus criterion over a bounded open set and its frontier"
      lean: "ZetaLean.PalomarDH.exists_zero_of_norm_lt_on_frontier"
      module: "DHSolution"
      status: "proved"
      note: >-
        Not a corollary of the disk form: it is quantified over an arbitrary
        bounded open set. In the development this is
        ZetaLean.DH.exists_zero_of_norm_lt_on_frontier.
    - source: >-
        The analytic half of the Davenport-Heilbronn theorem, existentially
        quantified in the function
      lean: "ZetaLean.PalomarDH.dh_analytic_half"
      module: "DHSolution"
      status: "proved"
      note: >-
        In the development this is ZetaLean.DH.dh_analytic_half. The witness is
        the Davenport-Heilbronn function itself, but the advertised statement is
        existential, so no character theory enters the statement surface.

acknowledgements: >-
  Lean 4 and Mathlib, whose maximum-modulus principle and Dirichlet L-function
  library the development rests on. Davenport and Heilbronn, whose construction
  is the object formalized.
