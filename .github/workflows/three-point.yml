# Tier 3b — the three- and four-point certificates and the Palomar V2 surface, on demand.
#
# The three-point material is a `lean_lib` of `lean/bridge` (see that package's
# lakefile for why it is not a package of its own), so this workflow builds
# `lean/bridge` and nothing else. What it has to establish, beyond "it compiles":
#
#  1. `ThreePoint` and `FourPoint` still prove their certificates and
#     unconditional bounds, with the three standard axioms and no forbidden token.
#  2. `V2Solution` proves the seven declarations `comparator-v2.json` advertises,
#     also with the three standard axioms — because those are what a registry
#     replay would check, and a `sorryAx` there would mean the Challenge's
#     deliberate holes had leaked into the proved surface.
#  3. `V2Challenge` carries exactly seven `sorry`, one per advertised statement,
#     and no more.
#
# Why this file exists at all: the author's machine cannot run `lake build`
# (a 13-inch laptop; Lean builds crash it), so this workflow IS the build loop.
# Two consequences shape it.
#
#  1. The cache is restore-then-save with a rolling key, not a fixed key. A
#     fixed key never updates once written, which is right for a pinned
#     toolchain and wrong for an iteration loop: the second run would rebuild
#     every dependency again. `restore-keys` takes the newest prior cache and
#     the save step writes a fresh one under a run-unique key.
#
#  2. The build is staged module by module with `/usr/bin/time`, rather than one
#     `lake build`. The generated cell tables are the expensive part and the
#     point of the exercise is to MEASURE which shape is expensive, so the
#     per-module wall clock has to survive into the log.
#
# Public repository, GitHub-hosted standard runners: billed zero.
name: three-point

on:
  push:
    branches: [ "bridge/**", "palomar/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-point-${{ github.ref }}
  cancel-in-progress: false

jobs:
  three-point:
    name: three- and four-point certificates and the V2 surface
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: lean/bridge
    steps:
      - uses: actions/checkout@v4

      # Restore BEFORE installing elan, which is the order `full.yml` uses: the
      # cache carries the toolchain itself, and elan-init with
      # `--default-toolchain none` is then a no-op over it.
      - name: restore elan and lake
        uses: actions/cache/restore@v4
        id: lakecache
        with:
          path: |
            ~/.elan
            lean/bridge/.lake
          key: three-point-${{ runner.os }}-${{ hashFiles('lean/bridge/lake-manifest.json', 'lean/bridge/lean-toolchain') }}-${{ github.run_id }}
          restore-keys: |
            three-point-${{ runner.os }}-${{ hashFiles('lean/bridge/lake-manifest.json', 'lean/bridge/lean-toolchain') }}-
            three-point-${{ runner.os }}-

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: toolchain
        run: |
          elan show || true
          lake --version

      - name: mathlib olean cache
        # Mathlib is pinned at 51e6992efd06126df61a496bebf8f49482a4e129, a real
        # master commit (2026-08-03, "chore: bump toolchain to v4.33.0-rc2"), so
        # the upstream olean cache exists for it. Without this the runner
        # compiles Mathlib from source and the loop is unusable. Not fatal if it
        # fails: the build below just becomes very slow.
        run: lake exe cache get || echo "::warning::mathlib cache get failed, falling back to source build"

      - name: dependencies (Zeta23 upstream, then the bridge development)
        run: |
          set -o pipefail
          /usr/bin/time -v lake build Zeta23Ext 2>&1 | tail -200

      - name: save cache after dependencies
        # Written here rather than only at the end so that a failure in the
        # generated tables still leaves the expensive dependency build cached.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            lean/bridge/.lake
          key: three-point-${{ runner.os }}-${{ hashFiles('lean/bridge/lake-manifest.json', 'lean/bridge/lean-toolchain') }}-${{ github.run_id }}

      - name: ThreePoint.Base
        run: /usr/bin/time -p lake build ThreePoint.Base

      - name: ThreePoint.Cells0
        run: /usr/bin/time -p lake build ThreePoint.Cells0

      - name: ThreePoint.Cells1
        run: /usr/bin/time -p lake build ThreePoint.Cells1

      - name: ThreePoint.Cells2
        run: /usr/bin/time -p lake build ThreePoint.Cells2

      - name: ThreePoint.Cells3
        run: /usr/bin/time -p lake build ThreePoint.Cells3

      - name: ThreePoint.Cells4
        run: /usr/bin/time -p lake build ThreePoint.Cells4

      - name: ThreePoint.Cells5
        run: /usr/bin/time -p lake build ThreePoint.Cells5

      - name: ThreePoint.Cells6
        run: /usr/bin/time -p lake build ThreePoint.Cells6

      - name: ThreePoint.Main (certificate, bound, axiom audit)
        run: |
          set -o pipefail
          /usr/bin/time -p lake build ThreePoint.Main 2>&1 | tee ../../main-build.log

      - name: FourPoint.Main (certificate, bound, axiom audit)
        run: |
          set -o pipefail
          /usr/bin/time -p lake build FourPoint.Main 2>&1 | tee ../../four-point-build.log

      - name: V2Challenge (statement-only; seven deliberate sorrys)
        run: |
          set -o pipefail
          /usr/bin/time -p lake build V2Challenge 2>&1 | tee ../../challenge-build.log

      - name: V2Solution (the advertised surface, axiom audit)
        run: |
          set -o pipefail
          /usr/bin/time -p lake build V2Solution 2>&1 | tee ../../solution-build.log

      - name: the whole package
        run: /usr/bin/time -p lake build

      - name: axiom audit
        # `#print axioms` at the bottom of ThreePoint/Main.lean and of
        # V2Solution.lean prints to the build log. Anything other than the three
        # standard axioms, on any advertised declaration, fails the job.
        working-directory: .
        run: |
          # `lake build` replays the diagnostics of every cached module, so these
          # logs carry the whole dependency tree's `#print axioms` output, not
          # just the declarations under audit. Audit OUR declarations, by name.
          #
          # Two things this must not do. It must not scan the whole tree: the
          # bridge prints `[propext, choice, Quot.sound]` wherever `Classical` is
          # open, which is the same three axioms under a shorter name, and a
          # blanket pattern reads that as a violation. And it must not pass on a
          # silent log: every advertised name has to be found, or a build that
          # printed nothing would audit clean.
          cat main-build.log four-point-build.log solution-build.log > audit.log

          echo "--- the audited declarations ---"
          grep -oE "'Zeta23Ext\.(Bridge\.(ThreePoint|FourPoint)|PalomarV2)\.[A-Za-z0-9_']+' depends on axioms: \[[^]]*\]" \
            audit.log || true

          if grep -E "'Zeta23Ext\.(Bridge\.(ThreePoint|FourPoint)|PalomarV2)\.[A-Za-z0-9_']+' depends on axioms" audit.log \
               | grep -vE "depends on axioms: \[propext, (Classical\.)?choice, Quot\.sound\]"; then
            echo "::error::a non-standard axiom reached an audited declaration"
            exit 1
          fi

          for d in Zeta23Ext.Bridge.ThreePoint.F3_eq \
                   Zeta23Ext.Bridge.ThreePoint.cover1 \
                   Zeta23Ext.Bridge.ThreePoint.three_point_cert \
                   Zeta23Ext.Bridge.ThreePoint.Phi_three \
                   Zeta23Ext.Bridge.ThreePoint.three_point_bound \
                   Zeta23Ext.Bridge.ThreePoint.three_point_bound_ratio \
                   Zeta23Ext.Bridge.FourPoint.F4_eq \
                   Zeta23Ext.Bridge.FourPoint.cover1 \
                   Zeta23Ext.Bridge.FourPoint.four_point_cert \
                   Zeta23Ext.Bridge.FourPoint.Phi_four \
                   Zeta23Ext.Bridge.FourPoint.four_point_bound \
                   Zeta23Ext.Bridge.FourPoint.four_point_bound_ratio \
                   Zeta23Ext.PalomarV2.n_point_bound \
                   Zeta23Ext.PalomarV2.eight_point_bound \
                   Zeta23Ext.PalomarV2.eight_point_bound_ratio \
                   Zeta23Ext.PalomarV2.three_point_bound \
                   Zeta23Ext.PalomarV2.three_point_bound_ratio \
                   Zeta23Ext.PalomarV2.four_point_bound \
                   Zeta23Ext.PalomarV2.four_point_bound_ratio; do
            if ! grep -qE "'$d' depends on axioms: \[propext, (Classical\.)?choice, Quot\.sound\]" audit.log; then
              echo "::error::no clean axiom line for $d -- the audit must not pass on a silent log"
              exit 1
            fi
          done
          echo "axiom audit clean: nineteen declarations, all [propext, Classical.choice, Quot.sound]"

      - name: the Challenge carries exactly seven sorrys, the Solution none
        working-directory: .
        run: |
          n=$(grep -c "declaration uses \`sorry\`" challenge-build.log || true)
          echo "V2Challenge sorry warnings: $n"
          if [ "$n" -ne 7 ]; then
            echo "::error::V2Challenge.lean must carry exactly seven deliberate sorrys, saw $n"
            exit 1
          fi
          if grep -q "V2Solution.lean.*declaration uses \`sorry\`" solution-build.log; then
            echo "::error::V2Solution.lean carries a sorry"
            exit 1
          fi

      - name: no sorry, no axiom, no native_decide in the proved surface
        run: |
          # Comments discussing the rule are fine; a real token is not. The
          # second grep drops matches that sit in a comment line, which is the
          # `full` workflow's own idiom. V2Challenge.lean is excluded on
          # purpose: its seven sorrys are what the Palomar format requires of a
          # statement-only module, and the step above counts them instead.
          if grep -rnE '(^|[^[:alnum:]_])(sorry|admit|native_decide|axiom|opaque|unsafe|implemented_by|extern)([^[:alnum:]_]|$)' \
               ThreePoint.lean ThreePoint/*.lean FourPoint.lean FourPoint/*.lean V2Solution.lean \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(--|/-)'; then
            echo "::error::a forbidden token is present in the proved surface"
            exit 1
          fi
          echo "zero sorry, zero axiom, zero native_decide"

      # `setup-python` rather than the runner's own interpreter, matching
      # `checks.yml` and `tests.yml`: a recent Ubuntu image's system Python is
      # externally managed and refuses a bare `pip install`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Palomar precheck (mechanical gate only)
        working-directory: .
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python scripts/palomar_precheck.py . lean/bridge \
            lean/bridge/comparator-v2.json lean/bridge/palomar-v2/formalization.yaml

      - name: save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            lean/bridge/.lake
          key: three-point-${{ runner.os }}-${{ hashFiles('lean/bridge/lake-manifest.json', 'lean/bridge/lean-toolchain') }}-${{ github.run_id }}-final
