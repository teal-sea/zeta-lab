# Tier 3, everything, on a schedule rather than on every commit.
#
# The full suite is 2189 tests and 10-20 minutes; the Lean arm is 8739 build
# jobs. Running either on every push would buy almost nothing over tier 2 and
# would train everyone to ignore a slow red badge, which is worse than no badge.
# Nightly is frequent enough to catch drift and rare enough to stay trusted.
#
# Lean is its own job so a numerical failure and a proof failure are
# distinguishable at a glance, and so the toolchain cache is not invalidated by
# Python changes.
name: full

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      lean_only:
        description: >-
          Verify only the lean arm. The numerical full suite is skipped, so a
          Lean build dispatched by hand does not run beside heavy numerics.
          Off by default: the nightly and an ordinary dispatch are unchanged.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  full-suite:
    name: full suite including slow
    # Skipped only when a dispatch explicitly asks for the lean arm alone.
    # On the schedule `inputs` is empty, so this is true and the job runs.
    if: ${{ !inputs.lean_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90   # suite 10-20 min, then the hunts about 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A depth-1 clone makes guards that read history refuse to answer:
          # the Hardy Z dossier staleness check skipped on every CI run and
          # hid a stale kernel record from 2026-09-28 to 2026-10-10
          # (issues #218, #219).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The evaluate door's test runs `uv run ... bloch-smoke`, exactly as
      # docs/doors/evaluate.md tells a reader to. Without uv on the runner it
      # failed with FileNotFoundError every night; bloch-environment.yml
      # already installs uv the same way.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: environments/bloch_certificate/uv.lock
      - name: install
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -m pip install --quiet --disable-pip-version-check -e .
          python -m pip install --quiet --disable-pip-version-check -r hunts/frontier_math/requirements.txt
      - name: full suite
        run: python -m pytest -q --durations=20
      # pytest collects only tests/ (testpaths), so the hunts' own tests ran
      # nowhere: on 2026-10-10 a first run of them found 44 failures (stale
      # pins, a missing dependency, test isolation) and two tests writing into
      # the tree. They run here, one process per directory (see the script
      # for why), after the suite and even when it failed, so this job's
      # verdict covers both and the step name says which one broke.
      # About 30 minutes on 4 cores (2026-10-10), 20 of them hunts/frontier_math.
      - name: hunts' own tests
        if: ${{ !cancelled() }}
        run: python scripts/run_hunt_tests.py

  # The numerical half of the same guard (issue #251).
  #
  # `full-suite` carries an `if:` so a hand-dispatched `lean_only` run can skip
  # it, and a skipped job does not fail a run. If that `if:` ever evaluated
  # false on the schedule, the nightly would go green with the full suite not
  # run at all, which reads exactly like a healthy night.
  #
  # So, like `lean-verdict` below, this job depends on `full-suite` and runs
  # with `if: always()`. Every result other than success is a failure, with one
  # exception: a `workflow_dispatch` that explicitly asked for `lean_only`,
  # where a skip is what was ordered. The schedule has no such exception.
  full-suite-verdict:
    name: the full suite produced a verdict
    needs: full-suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: a skipped or missing suite is a failure unless lean_only asked for it
        env:
          RESULT: ${{ needs.full-suite.result }}
          EVENT: ${{ github.event_name }}
          LEAN_ONLY: ${{ inputs.lean_only }}
        run: |
          echo "full-suite result: ${RESULT} (event ${EVENT}, lean_only '${LEAN_ONLY}')"
          case "${RESULT}" in
            success)
              echo "the full suite ran, slow tier included, and passed"
              ;;
            skipped)
              if [ "${EVENT}" = "workflow_dispatch" ] && [ "${LEAN_ONLY}" = "true" ]; then
                echo "skipped on request: a workflow_dispatch with lean_only. No numerical verdict was asked for."
              else
                echo "::error::the full suite was SKIPPED on a ${EVENT} run that did not ask for lean_only. Nothing numerical was verified. See issue #251."
                exit 1
              fi
              ;;
            failure)
              echo "::error::the full suite FAILED"
              exit 1
              ;;
            cancelled)
              echo "::error::the full suite produced NO VERDICT. It was cancelled, which is what a 'timeout-minutes' kill looks like. Nothing was verified."
              exit 1
              ;;
            *)
              echo "::error::the full suite reported an unrecognised result '${RESULT}'. Unknown is not empty: treating it as unverified."
              exit 1
              ;;
          esac

  lean:
    name: lean arm, zero sorrys
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: cache elan and lake
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: toolchain
        working-directory: lean
        run: |
          elan show || true
          lake --version

      - name: mathlib olean cache
        # THE fix for the seven-night stall (issue #167). Without this, `lake
        # build` compiles Mathlib from source, which does not fit in any
        # reasonable timeout, so the job was killed at 90 minutes every night
        # and its post-job cache save never ran -- a loop that could not
        # self-heal. three-point.yml and four-point.yml already did this; the
        # nightly arm was the one that did not. Not fatal if it fails: the
        # build below just becomes very slow again.
        working-directory: lean
        run: lake exe cache get || echo "::warning::mathlib cache get failed, falling back to source build"

      - name: build
        working-directory: lean
        run: lake build

      - name: save cache after the build
        # Written as an explicit step rather than relying on the post-job save,
        # because a job killed by timeout-minutes never runs its post steps.
        # That is precisely what kept the cache empty run after run.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}

      - name: the axioms behind the Mertens chain
        # A band in a theorem statement is only worth what the theorem rests
        # on, and `lake build` does not check that; `#print axioms` does.
        # `hunts/r_4218d4/PrintMertensAxioms.lean` already names the
        # statements to audit. The oleans are built by the step above, so
        # this costs seconds.
        working-directory: lean
        run: |
          set -o pipefail
          lake env lean ../hunts/r_4218d4/PrintMertensAxioms.lean 2>&1 | tee axioms.txt
          # A guard that matches nothing must fail loudly rather than pass.
          printed=$(grep -c 'depends on axioms' axioms.txt || true)
          echo "axiom lines printed: ${printed}"
          if [ "${printed}" -lt 11 ]; then
            echo "::error::the axiom audit printed only ${printed} lines; it is not reading what it thinks it is"
            exit 1
          fi
          if grep -qi 'sorry' axioms.txt; then
            echo "::error::a sorry appears in the Mertens axiom audit"
            exit 1
          fi
          # Joined and space-squeezed so a pretty-printer line break cannot
          # turn a real mismatch into a silent pass.
          joined=$(tr '\n' ' ' < axioms.txt | tr -s ' ')
          want="'ZetaLean.Mertens.mertens_second_theorem' depends on axioms: [propext, Classical.choice, Quot.sound]"
          case "${joined}" in
            *"${want}"*) echo "mertens_second_theorem: the three standard axioms, nothing else" ;;
            *) echo "::error::mertens_second_theorem does not rest on exactly [propext, Classical.choice, Quot.sound]"; exit 1 ;;
          esac

      - name: no sorrys in the certified arm
        working-directory: lean
        run: |
          # A `sorry` in a proof is an uncertified step. Comments discussing the
          # rule are fine; a real one is not. Match only proof positions.
          #
          # This scanned `ZetaLean/*.lean`, which does not recurse, so 54 files
          # under ZetaLean/Pub1/, ZetaLean/EForm3/ and friends were never
          # checked -- including the whole publication arm. A `sorry` there
          # passed the gate silently. It now scans the tree.
          scanned=$(find ZetaLean -name '*.lean' | wc -l)
          echo "scanning ${scanned} .lean files under ZetaLean/"
          # A guard that matches nothing must fail loudly rather than pass:
          # this repository has already been bitten by a check that failed open.
          if [ "${scanned}" -lt 20 ]; then
            echo "::error::only ${scanned} .lean files found under ZetaLean/. This guard is not reading the tree it thinks it is; refusing to report a pass."
            exit 1
          fi
          if grep -rnE '(^|[^[:alnum:]_])sorry([^[:alnum:]_]|$)' --include='*.lean' ZetaLean \
               | grep -vE '^\s*[^:]+:[0-9]+:\s*(--|/-)' \
               | grep -vE '`sorry`'; then
            echo "::error::a sorry reached the certified arm"
            exit 1
          fi
          echo "zero sorrys across ${scanned} files"

  # The observability half of issue #167.
  #
  # A job killed by `timeout-minutes` is reported by GitHub with conclusion
  # `cancelled`, not `failure` and not `timed_out`. A cancelled run is not a red
  # badge and does not read as broken, which is how the lean arm stayed dead for
  # eight consecutive runs (2026-08-25 .. 2026-09-01) without anything saying so.
  #
  # This job depends on `lean` and runs with `if: always()`, so it still runs
  # when `lean` was cancelled. It turns every non-success into a real failure.
  # Silence is no longer distinguishable from success by accident: it is
  # reported.
  lean-verdict:
    name: the lean arm produced a verdict
    needs: lean
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: a missing verdict is a failure, not a quiet pass
        run: |
          result='${{ needs.lean.result }}'
          echo "lean job result: ${result}"
          case "${result}" in
            success)
              echo "the lean arm built and reported zero sorrys"
              ;;
            failure)
              echo "::error::the lean arm FAILED: the build broke or a sorry reached it"
              exit 1
              ;;
            cancelled)
              echo "::error::the lean arm produced NO VERDICT. It was cancelled, which is what a 'timeout-minutes' kill looks like. Nothing was verified. See issue #167: this state is silent by default, which is why this check exists."
              exit 1
              ;;
            skipped)
              echo "::error::the lean arm was SKIPPED, so nothing in lean/ was verified on this run"
              exit 1
              ;;
            *)
              echo "::error::the lean arm reported an unrecognised result '${result}'. Unknown is not empty: treating it as unverified."
              exit 1
              ;;
          esac
