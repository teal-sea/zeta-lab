# Publish the generated reading surface to a branch a host can watch.
#
# `scripts/72_site.py` renders the public pages and `scripts/70_lab_state.py`
# the internal research-state view. Both derive every fact from a tree artifact
# — the graveyard, guard and review ledgers, the hunts' case logs, the gate
# evidence, and branches ahead of main — so the page cannot drift from the
# repository. If the tree changes the page changes; if nobody updates the tree
# the page says so.
#
# The build output is force-pushed to `deploy/site` as a single commit. That
# branch is machine-owned: CI is the only writer, its history is disposable,
# and `70_lab_state.py` and `72_site.py` both skip the `deploy/` namespace so a
# publishing branch is never counted as a line of research.
#
# Hosting is whatever watches that branch. Point a project at `deploy/site`
# with no build command and no framework preset — the branch is already the
# finished directory. Nothing here needs Python on the host, which is the point
# of publishing built output rather than source: the host does not have to
# reproduce mpmath, numpy and scipy to render four HTML pages.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # force-pushes the built output to deploy/site

concurrency:
  group: site
  cancel-in-progress: false   # never cancel a half-finished publish

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the live-threads section reads branches

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -m pip install --quiet --disable-pip-version-check -e .

      - name: build the site
        run: |
          python scripts/72_site.py --out _site
          # the internal research-state view, kept alongside the public pages
          python scripts/70_lab_state.py --out _site/state.html
          cp interactive_lab/prime_genesis.html _site/prime_genesis.html

      - name: the pages must be self-contained
        run: |
          # The contract every page here keeps: no scripts, no network. If
          # either appears, the site has stopped being a thing you can read
          # offline and started being an app, and that is worth blocking.
          # 72_site.py asserts this itself; this is the independent check.
          fail=0
          for f in $(find _site -name '*.html' -not -name 'prime_genesis.html'); do
            if grep -qi "<script" "$f"; then
              echo "::error file=$f::grew a <script> tag"; fail=1
            fi
            if grep -oE "https?://[^\"'<> ]+" "$f" | grep -qv "^https://github.com/"; then
              echo "::error file=$f::grew an external request"; fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "self-contained: no scripts, no external requests"

      - name: publish to deploy/site
        run: |
          # A single disposable commit, force-pushed. There is no history worth
          # keeping on a branch whose every byte is regenerated from main.
          cd _site
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b deploy/site
          git add -A
          git commit -q -m "site: built from ${GITHUB_SHA}"
          git push --force -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            deploy/site
          echo "published $(find . -name '*.html' | wc -l) pages to deploy/site"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
