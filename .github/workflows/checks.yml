# Tier 1 — the gate. Runs on every push and pull request.
#
# Stdlib + pytest only: no numpy, scipy, mpmath, sympy or editable install, so
# there is nothing to build and nothing to cache. 340 tests in ~7 seconds
# locally. This tier exists because the public repository's whole claim is that
# the work is checkable, and until now every check depended on a human
# remembering to run it.
#
# What it deliberately does NOT do: the numerical suite, the doors (which
# execute real scripts), or Lean. Those are tiers 2 and 3 — see full.yml and
# lean.yml. Cost here is measured in operator attention on a red build, not
# money: this repository is public, so GitHub-hosted standard runners bill zero.
# The scarce thing is a fast, trustworthy signal, and a gate that takes ten
# minutes is one nobody waits for.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance and hygiene (no numerical deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lab_state derives live threads from git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install pytest only
        run: python -m pip install --quiet --disable-pip-version-check pytest

      - name: the tree's own invariants
        run: |
          python -m pytest -q -p no:cacheprovider -n0 --no-header \
            tests/test_docs_numbering.py \
            tests/test_repo_hygiene.py \
            tests/test_threads.py \
            tests/test_telemetry.py \
            tests/test_huntspec.py \
            tests/test_meta_ledger.py \
            tests/test_graveyard.py \
            tests/test_review.py \
            tests/test_lab_state.py \
            tests/test_dossier_schema.py \
            tests/test_discovery_schema.py

      - name: CONTEXT.md is not stale
        run: python scripts/make_context.py --check
