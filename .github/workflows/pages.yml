# The public reading surface, generated from public evidence.
#
# `scripts/72_site.py` renders the public reading surface — four pages, every
# fact on them read from a repository artifact. `scripts/70_lab_state.py`
# renders the internal research-state view and is published alongside it at
# /state.html. Both follow the same rule: "no scripts and no network: a page
# you can read, not an app you can be reassured by".
#
# Generated rather than written, for the same reason the script derives rather
# than declares: a hand-maintained page rots and then reads as authoritative.
# Every section comes from a tree artifact — the graveyard, guard and review
# ledgers, the hunts' case logs, and branches ahead of main. If the tree
# changes, the page changes; if nobody updates the tree, the page says so.
#
# Requires GitHub Pages to be enabled for the repository with source "GitHub
# Actions". Until then this workflow builds the artifact and the deploy step
# fails loudly rather than silently publishing nothing.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # never cancel a half-finished publish

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the live-threads section reads branches

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -m pip install --quiet --disable-pip-version-check -e .

      - name: build the site
        run: |
          python scripts/72_site.py --out _site
          # the internal research-state view, kept alongside the public pages
          python scripts/70_lab_state.py --out _site/state.html
          cp interactive_lab/prime_genesis.html _site/prime_genesis.html

      - name: the pages must be self-contained
        run: |
          # The contract every page here keeps: no scripts, no network. If
          # either appears, the site has stopped being a thing you can read
          # offline and started being an app, and that is worth blocking.
          # 72_site.py asserts this itself; this is the independent check.
          fail=0
          for f in $(find _site -name '*.html' -not -name 'prime_genesis.html'); do
            if grep -qi "<script" "$f"; then
              echo "::error file=$f::grew a <script> tag"; fail=1
            fi
            if grep -oE "https?://[^\"'<> ]+" "$f" | grep -qv "^https://github.com/"; then
              echo "::error file=$f::grew an external request"; fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "self-contained: no scripts, no external requests"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
