# Replay of the Lean archive Levent Alpöge posted on 2026-11-20 with the note
# https://alpo.ge/remark.pdf, which claims the Riemann hypothesis and the
# generalized Riemann hypothesis for Dirichlet L-functions as theorems of
# Lean 4.33.1 over Mathlib v4.33.1. What this is for, what it can and cannot
# say, and every allocation: hunts/alpoge_replay/MISSION.md and RUNS.md.
#
# The archive is one Lake package of 175,187 modules, 1.03 GB of source, and
# its final theorem imports all of them. No hosted runner builds that in one
# six-hour job, so the build is cut into rounds (hunts/alpoge_replay/
# replay_plan.py). In a round every shard is a set of unbuilt modules whose
# imports are either built already or in the same shard, so shards of a round
# are independent and run on separate runners. Each shard uploads the Lake
# outputs of the modules it finished; the round's merge job folds them into
# one bundle and one state file, and, when `chain` is on, dispatches the next
# round. When `Main` is built, the verdict mode restores everything on one
# runner, asks Lake to confirm nothing is left to build, and prints the axioms
# behind the five theorems of Main.lean.
#
# The archive is data from outside this repository. It is fetched from its
# author's site, pinned by sha256, extracted outside the checkout, and built
# only here, on runners that hold a read-only token. Nothing in it is run on a
# laboratory machine.
#
# Nothing here is a claim until the logs say so, and a green round is not a
# verdict: only the verdict mode's axiom printout is.
name: replay-alpoge-rh
# The run title carries the round and the state it starts from, so the newest
# run names the artifact that holds everything merged so far.
run-name: alpoge ${{ inputs.epoch || 'p1' }} ${{ inputs.mode || 'round' }} r${{ inputs.round || '0' }} from state ${{ inputs.state_id || 'none' }} (${{ inputs.shards || '4' }}x${{ inputs.build_minutes || '6' }}min)

on:
  # Dispatch only. A workflow that exists only on a feature branch cannot be
  # dispatched by name until it has run once; the first commit of this file
  # carried a push trigger for that reason and ran the pilot as run
  # 44775351495. The trigger is gone so that later edits do not rerun it.
  workflow_dispatch:
    inputs:
      mode:
        description: round (plan, build, merge), verdict (restore everything, print axioms), remerge (fold a round whose merge job failed, from its run id), rehearse (the verdict job's restore and no-op build on whatever is built so far, then a timing of imports; prints no axioms), or probe (a timing of imports on a plain directory under several read-ahead settings; builds nothing)
        type: choice
        options: [round, verdict, remerge, rehearse, probe]
        default: round
      from_run:
        description: remerge only. The run id of the round whose shards finished but whose merge job did not
        type: string
        default: ""
      epoch:
        description: namespace for this campaign's artifacts; a new epoch starts from nothing
        type: string
        default: p1
      round:
        description: round number; 0 starts a campaign
        type: string
        default: "0"
      state_id:
        description: artifact id of the previous round's state (empty for round 0)
        type: string
        default: ""
      shards:
        description: runners per round
        type: string
        default: "4"
      build_minutes:
        description: wall-clock minutes of lake build per shard before it is stopped and packed
        type: string
        default: "6"
      chain:
        description: dispatch the next round (or the verdict) when this one is merged
        type: boolean
        default: false
      max_round:
        description: the chain stops after this round whatever happened
        type: string
        default: "60"
      compress_fs:
        description: keep build outputs on a zstd-compressed btrfs loop volume (for the late rounds, when they outgrow the disk)
        type: boolean
        default: false
      lean_threads:
        description: LEAN_NUM_THREADS for lake build, which caps how many modules compile at once; empty means two
        type: string
        default: ""
      fill:
        description: second planning pass; idle shards also build modules whose unbuilt imports another shard owns, building those imports twice
        type: boolean
        default: false
      swap_gb:
        description: extra swap on each build runner, in GB; the chain sets it after a module was killed alone for memory
        type: string
        default: "0"

permissions:
  contents: read
  actions: read

# One round at a time per epoch. A rehearsal or a probe runs beside the
# rounds, in a group of its own: a pending run in the rounds' group would be
# displaced by the next round's dispatch, or displace it.
concurrency:
  group: replay-alpoge-rh-${{ inputs.epoch || 'p1' }}${{ (inputs.mode == 'rehearse' || inputs.mode == 'probe') && format('-{0}', inputs.mode) || '' }}
  cancel-in-progress: false

env:
  ARCHIVE_SHA256: 9631b4f020199e580ba86178cb56c6e9b09f690c2369a80dc4334aa93f49c7fc
  ARCHIVE_BYTES: "239275554"
  ARCHIVE_URL_PREFIX: https://alpo.ge/lean.tar.gz.part
  ARCHIVE_CACHE_KEY: alpoge-archive-9631b4f02019
  MODE: ${{ inputs.mode || 'round' }}
  EPOCH: ${{ inputs.epoch || 'p1' }}
  ROUND: ${{ inputs.round || '0' }}
  STATE_ID: ${{ inputs.state_id || '' }}
  SHARDS: ${{ inputs.shards || '4' }}
  BUILD_MINUTES: ${{ inputs.build_minutes || '6' }}
  CHAIN: ${{ inputs.chain || 'false' }}
  MAX_ROUND: ${{ inputs.max_round || '60' }}
  COMPRESS_FS: ${{ inputs.compress_fs || 'false' }}
  # Two compiles at once unless a dispatch says otherwise: from about round 9
  # the modules import enough that four exhaust a 15 GB runner.
  LEAN_THREADS: ${{ inputs.lean_threads || '2' }}
  FILL: ${{ inputs.fill || 'false' }}
  SWAP_GB: ${{ inputs.swap_gb || '0' }}
  HUNT: hunts/alpoge_replay

jobs:
  # --------------------------------------------------------------------------
  # plan: read the import graph, read the state, cut the next round
  # --------------------------------------------------------------------------
  plan:
    if: (inputs.mode || 'round') == 'round'
    name: plan round ${{ inputs.round || '0' }} (${{ inputs.epoch || 'p1' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      n_shards: ${{ steps.plan.outputs.n_shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: restore the archive from this branch's cache
        id: arc
        uses: actions/cache/restore@v4
        with:
          path: ~/replay/lean.tar.gz
          key: ${{ env.ARCHIVE_CACHE_KEY }}

      - name: fetch the archive from its author's site (cache miss only)
        if: steps.arc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/replay/parts" && cd "$HOME/replay/parts"
          for i in 01 02 03 04 05 06 07 08 09 10 11 12 13 14; do
            curl -sS -L --fail --retry 5 --retry-delay 5 --max-time 900 \
              -o "lean.tar.gz.part$i" "${ARCHIVE_URL_PREFIX}$i"
          done
          cat lean.tar.gz.part?? > "$HOME/replay/lean.tar.gz"
          rm -rf "$HOME/replay/parts"

      - name: verify the archive against the pinned hash
        run: |
          set -euo pipefail
          test "$(stat -c %s "$HOME/replay/lean.tar.gz")" = "$ARCHIVE_BYTES"
          echo "$ARCHIVE_SHA256  $HOME/replay/lean.tar.gz" | sha256sum -c -

      - name: save the archive to this branch's cache
        if: steps.arc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/replay/lean.tar.gz
          key: ${{ env.ARCHIVE_CACHE_KEY }}

      - name: extract the sources
        run: |
          set -euo pipefail
          tar -xzf "$HOME/replay/lean.tar.gz" -C "$HOME/replay" --no-same-owner
          find "$HOME/replay/lean/src" -name '*.lean' | wc -l

      - name: fetch the previous round's state
        if: env.STATE_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$STATE_ID" in *[!0-9]*) echo "::error::state_id must be a number"; exit 1;; esac
          bash "$HUNT/fetch_artifact.sh" "$STATE_ID" state.zip
          mkdir -p state-prev && unzip -o -q state.zip -d state-prev
          test -f state-prev/state.json

      - name: plan the round
        id: plan
        run: |
          set -euo pipefail
          python3 "$HUNT/replay_plan.py" dag --src "$HOME/replay/lean/src" --out dag.json
          args=()
          if [ -f state-prev/state.json ]; then args+=(--state state-prev/state.json); fi
          if [ "$FILL" = "true" ]; then args+=(--fill); fi
          # As many compiles at once as the build step will run, for
          # BUILD_MINUTES, planned forty percent over. A shard given too much
          # is cut by its deadline and what it did not reach is planned
          # again; a shard given too little sits idle, and round 14, planned
          # at fifteen percent over a rate that round 13's thrashing had
          # inflated, left its runners idle for a third of the hour.
          budget=$(python3 -c "print(int(float('$BUILD_MINUTES') * 60 * float('${LEAN_THREADS:-2}' or 4) * 1.4))")
          # what a shard can really do: the filling pass stops there
          capacity=$(python3 -c "print(int(float('$BUILD_MINUTES') * 60 * float('${LEAN_THREADS:-2}' or 4)))")
          python3 "$HUNT/replay_plan.py" plan --dag dag.json "${args[@]}" \
            --round "$ROUND" --shards "$SHARDS" --budget-s "$budget" --fill-budget-s "$capacity" --out plan | tee plan.txt
          n=$(jq .n_shards plan/plan.json)
          echo "n_shards=$n" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c -n --argjson n "$n" '[range(0;$n)]')" >> "$GITHUB_OUTPUT"
          cp dag.json plan/dag.json
          if [ -f state-prev/state.json ]; then cp state-prev/state.json plan/state-prev.json; fi
          {
            echo "### plan, round $ROUND, epoch $EPOCH"
            echo '```'
            head -1 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publish the plan
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-plan-r${{ env.ROUND }}
          path: plan
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # build: one runner per shard
  # --------------------------------------------------------------------------
  build:
    needs: plan
    if: needs.plan.outputs.n_shards != '0'
    name: r${{ inputs.round || '0' }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      LEAN_DIR: /home/runner/replay/lean
      OUT: /home/runner/replay/out
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: record the run and free the runner's disk
        run: |
          set -euo pipefail
          mkdir -p "$OUT/evidence"
          {
            echo "zeta-lab commit: $GITHUB_SHA"
            echo "epoch $EPOCH round $ROUND shard $SHARD build_minutes $BUILD_MINUTES"
            echo "runner: $(nproc) cores, $(free -g | awk '/Mem:/{print $2}') GB RAM, kernel $(uname -r)"
            # how many of those are cores and how many are threads of a core
            lscpu | grep -E '^(Model name|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|CPU\(s\)):' | sed 's/  */ /g' || true
          } | tee "$OUT/evidence/run.txt"
          # The cleanup took 96 to 135 s in the pilot, so it runs behind the
          # setup steps; it is done long before the disk is needed.
          nohup sudo sh -c 'rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; docker image prune --all --force' >/dev/null 2>&1 &
          # A module high in the graph maps tens of thousands of .olean files;
          # the default limit of 65530 mappings would make Lean read them into
          # memory instead.
          sudo sysctl -w vm.max_map_count=2097152 | tee -a "$OUT/evidence/run.txt"
          # Extra swap only in a round that retries a module killed alone
          # for memory (round 14 met one that held 13.7 GB of 15.6). With
          # four compiles and no watchdog, in round 10, swap only made the
          # survivors thrash. Now the watchdog suspends everything but the
          # largest process, so what pages is the suspended, and the large
          # module if it must; low swappiness keeps the kernel from paging
          # heaps out to make room for cache.
          if [ "${SWAP_GB:-0}" != "0" ]; then
            sudo fallocate -l "${SWAP_GB}G" /swapfile-alpoge && sudo chmod 600 /swapfile-alpoge \
              && sudo mkswap -q /swapfile-alpoge && sudo swapon /swapfile-alpoge \
              && sudo sysctl -w vm.swappiness=10 | tee -a "$OUT/evidence/run.txt" \
              || echo "extra swap could not be added" | tee -a "$OUT/evidence/run.txt"
          fi
          free -g | tee -a "$OUT/evidence/run.txt"
          df -h / /mnt 2>/dev/null | tee -a "$OUT/evidence/run.txt"

      - name: restore the archive from this branch's cache
        id: arc
        uses: actions/cache/restore@v4
        with:
          path: ~/replay/lean.tar.gz
          key: ${{ env.ARCHIVE_CACHE_KEY }}

      - name: fetch the archive from its author's site (cache miss only)
        if: steps.arc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/replay/parts" && cd "$HOME/replay/parts"
          for i in 01 02 03 04 05 06 07 08 09 10 11 12 13 14; do
            curl -sS -L --fail --retry 5 --retry-delay 5 --max-time 900 \
              -o "lean.tar.gz.part$i" "${ARCHIVE_URL_PREFIX}$i"
          done
          cat lean.tar.gz.part?? > "$HOME/replay/lean.tar.gz"
          rm -rf "$HOME/replay/parts"

      - name: verify and extract the archive
        run: |
          set -euo pipefail
          test "$(stat -c %s "$HOME/replay/lean.tar.gz")" = "$ARCHIVE_BYTES"
          echo "$ARCHIVE_SHA256  $HOME/replay/lean.tar.gz" | sha256sum -c -
          tar -xzf "$HOME/replay/lean.tar.gz" -C "$HOME/replay" --no-same-owner
          rm -f "$HOME/replay/lean.tar.gz"
          cat "$LEAN_DIR/lean-toolchain" | tee -a "$OUT/evidence/run.txt"

      - name: fetch this round's plan
        uses: actions/download-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-plan-r${{ env.ROUND }}
          path: plan

      # A plain directory when what the shard imports fits the disk, the
      # compressed volume only when it does not (build_volume.sh says why).
      - name: a place for the build outputs
        run: |
          set -euo pipefail
          need=$(jq '.need | length' "plan/shard-$SHARD.json")
          limit=90000
          if [ "$COMPRESS_FS" != "true" ]; then limit=100000000; fi
          bash "$HUNT/build_volume.sh" "$LEAN_DIR/.lake/build" "$need" "$limit" | tee -a "$OUT/evidence/run.txt"
          df -h "$LEAN_DIR/.lake/build" | tee -a "$OUT/evidence/run.txt"

      - name: install elan and the toolchain the archive names
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat "$LEAN_DIR/lean-toolchain")"
          cd "$LEAN_DIR"
          "$HOME/.elan/bin/lean" --version | tee -a "$OUT/evidence/run.txt"
          "$HOME/.elan/bin/lake" --version | tee -a "$OUT/evidence/run.txt"

      - name: fetch the pinned dependencies and the Mathlib olean cache
        working-directory: /home/runner/replay/lean
        run: |
          set -euo pipefail
          start=$(date +%s)
          lake exe cache get 2>&1 | tail -4 | tr '\r' '\n' | tail -4
          echo "cache get wall_seconds=$(( $(date +%s) - start ))" | tee -a "$OUT/evidence/run.txt"
          echo "mathlib at $(git -C .lake/packages/mathlib rev-parse HEAD)" | tee -a "$OUT/evidence/run.txt"
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 0df444a360eaa60ab8c11dca51a86af692955474
          df -h / | tee -a "$OUT/evidence/run.txt"

      - name: restore the modules this shard imports from earlier rounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shard="plan/shard-$SHARD.json"
          # one download per bundle, its chunks unpacked three at a time,
          # and of each chunk only the modules this shard imports
          jq -r '.need[]' "$shard" > need.txt
          RESTORE_NEED="$PWD/need.txt" bash "$HUNT/restore_chunks.sh" "$shard" "$LEAN_DIR" | tee -a "$OUT/evidence/run.txt"
          du -sh "$LEAN_DIR/.lake/build" 2>/dev/null | tee -a "$OUT/evidence/run.txt" || true
          df -h / | tee -a "$OUT/evidence/run.txt"
          python3 "$HUNT/replay_shard.py" check --lean-dir "$LEAN_DIR" --shard "$shard" | tee -a "$OUT/evidence/run.txt"

      # No token is in the environment of this step. It is the only step that
      # elaborates the archive's code.
      - name: lake build the shard, under its deadline
        run: |
          set -uo pipefail
          start=$(date +%s)
          # Lake writes a setup file per module it starts, about 6 MB each
          # when the module imports Mathlib, and `lean` reads it once at
          # startup. Nothing reads it again, so the ones older than twenty
          # minutes go, or a long shard would fill the disk with them.
          ( while sleep 120; do
              find "$LEAN_DIR/.lake/build/ir" -name '*.setup.json' -mmin +20 -delete 2>/dev/null
            done ) &
          pruner=$!
          # Without a watchdog a full runner stops answering and the whole
          # shard is lost. Under 2.5 GB available it suspends every lean
          # process but the largest, which then has the room; they resume
          # when memory is back or nothing else runs. Under 700 MB it kills a
          # suspended one ("crowded": no strike against the module, it is
          # simply planned again), and only a process that is alone and
          # still fills the runner is killed as "alone", which is recorded as
          # a crash. It also writes each module's peak memory.
          swapargs=()
          if [ "${SWAP_GB:-0}" != "0" ]; then swapargs=(--swap-floor-mb 1024); fi
          python3 "$HUNT/mem_watchdog.py" --name lean --floor-mb 700 --soft-mb 2500 --resume-mb 5000 \
            "${swapargs[@]}" --root "$LEAN_DIR/src" --log "$OUT/evidence/mem.log" &
          watchdog=$!
          # Lake compiles one module per worker thread. Fewer threads is the
          # remedy when modules high in the graph exhaust the runner's memory
          # (measured on a toy package: 8 modules take 20 s at the default,
          # 43 s at two threads, 79 s at one).
          if [ -n "$LEAN_THREADS" ]; then
            export LEAN_NUM_THREADS="$LEAN_THREADS"
            echo "LEAN_NUM_THREADS=$LEAN_NUM_THREADS" | tee -a "$OUT/evidence/run.txt"
          fi
          python3 "$HUNT/replay_shard.py" build --lean-dir "$LEAN_DIR" --shard "plan/shard-$SHARD.json" \
            --minutes "$BUILD_MINUTES" --log "$OUT/build.log" | tee -a "$OUT/evidence/run.txt"
          kill "$pruner" "$watchdog" 2>/dev/null || true
          wait "$watchdog" 2>/dev/null || true
          grep -c ' KILL ' "$OUT/evidence/mem.log" | sed 's/^/watchdog kills: /' | tee -a "$OUT/evidence/run.txt" || true
          grep -c ' STOP ' "$OUT/evidence/mem.log" | sed 's/^/watchdog suspensions: /' | tee -a "$OUT/evidence/run.txt" || true
          tail -1 "$OUT/evidence/mem.log" | tee -a "$OUT/evidence/run.txt" || true
          echo "build wall_seconds=$(( $(date +%s) - start ))" | tee -a "$OUT/evidence/run.txt"
          df -h / | tee -a "$OUT/evidence/run.txt"

      - name: pack what finished
        id: pack
        run: |
          set -euo pipefail
          chunk="r${ROUND}-s${SHARD}"
          python3 "$HUNT/replay_shard.py" pack --lean-dir "$LEAN_DIR" --shard "plan/shard-$SHARD.json" \
            --log "$OUT/build.log" --chunk "$chunk" --filelist "$OUT/files.txt" \
            --kills "$OUT/evidence/mem.log.kills.tsv" --memlog "$OUT/evidence/mem.log" \
            --done "$OUT/done-$chunk.json" | tee "$OUT/evidence/pack.json"
          mkdir -p "$OUT/chunk" "$OUT/done"
          cp "$OUT/done-$chunk.json" "$OUT/done/"
          if [ -s "$OUT/files.txt" ]; then
            tar -C "$LEAN_DIR" -cf - -T "$OUT/files.txt" | zstd -T0 -6 -q -o "$OUT/chunk/chunk-$chunk.tar.zst"
            ls -l "$OUT/chunk" | tee -a "$OUT/evidence/run.txt"
            echo "have_chunk=true" >> "$GITHUB_OUTPUT"
          fi
          zstd -q -9 "$OUT/build.log" -o "$OUT/evidence/build.log.zst"
          {
            echo "### round $ROUND shard $SHARD"
            echo '```'
            jq -c '{planned, built, failed, crashed, crowded, killed_alone, extra_planned, extra_built, rebuilt_outside_shard, sorry_warning_lines, raw_output_bytes, bytes_by_kind, build_status, mem}' "$OUT/evidence/pack.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publish the chunk
        if: steps.pack.outputs.have_chunk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-chunk-r${{ env.ROUND }}-s${{ matrix.shard }}
          path: /home/runner/replay/out/chunk
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: publish the done record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-done-r${{ env.ROUND }}-s${{ matrix.shard }}
          path: /home/runner/replay/out/done
          retention-days: 30
          if-no-files-found: warn

      - name: preserve the evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-evidence-r${{ env.ROUND }}-s${{ matrix.shard }}
          path: /home/runner/replay/out/evidence
          retention-days: 90
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # merge: fold the round into the state, bundle its chunks, hand on
  # --------------------------------------------------------------------------
  merge:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    name: merge round ${{ inputs.round || '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: free the runner's disk (the bundle step pulls every chunk of the round through it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: fetch the plan and the done records of this round
        uses: actions/download-artifact@v4
        with:
          pattern: alpoge-${{ env.EPOCH }}-{plan,done}-r${{ env.ROUND }}*
          path: in

      - name: fold the done records into the state (first pass, to count)
        id: count
        run: |
          set -euo pipefail
          ls in
          plan="in/alpoge-${EPOCH}-plan-r${ROUND}"
          args=()
          if [ -f "$plan/state-prev.json" ]; then args+=(--state "$plan/state-prev.json"); fi
          python3 "$HUNT/replay_shard.py" merge --dag "$plan/dag.json" "${args[@]}" \
            --done-dir in --round "$ROUND" --out state-count.json --github-output "$GITHUB_OUTPUT" | tee merge.json

      - name: bundle this round's chunks into one artifact
        id: bundle
        if: steps.count.outputs.built_this_round != '0'
        uses: actions/upload-artifact/merge@v4
        with:
          name: alpoge-${{ env.EPOCH }}-bundle-r${{ env.ROUND }}
          pattern: alpoge-${{ env.EPOCH }}-chunk-r${{ env.ROUND }}-s*
          delete-merged: true
          compression-level: 0
          retention-days: 14

      - name: write the state with the bundle's artifact id
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan="in/alpoge-${EPOCH}-plan-r${ROUND}"
          args=()
          if [ -f "$plan/state-prev.json" ]; then args+=(--state "$plan/state-prev.json"); fi
          if [ "${{ steps.count.outputs.built_this_round }}" != "0" ]; then
            # Round 9 (run 44846358339) died here: the bundle had just been
            # uploaded and the run's artifact listing did not show it yet.
            # Take the id from the action that made it, and if that is empty
            # ask the listing for up to three minutes.
            bid="${{ steps.bundle.outputs.artifact-id }}"
            tries=0
            while [ -z "$bid" ] && [ "$tries" -lt 18 ]; do
              bid=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.name==\"alpoge-${EPOCH}-bundle-r${ROUND}\") | .id" < /dev/null | tail -1 || true)
              if [ -z "$bid" ]; then tries=$((tries + 1)); sleep 10; fi
            done
            if [ -z "$bid" ]; then echo "::error::the bundle of round $ROUND never appeared in the artifact listing"; exit 1; fi
            echo "bundle artifact id: $bid"
            args+=(--bundle-id "$bid")
          fi
          mkdir -p state
          python3 "$HUNT/replay_shard.py" merge --dag "$plan/dag.json" "${args[@]}" \
            --done-dir in --round "$ROUND" --out state/state.json | tee merge.json
          cp merge.json state/merge.json
          {
            echo "### merge, round $ROUND, epoch $EPOCH"
            echo '```'
            jq -c 'del(.failed)' merge.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publish the state
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-state-r${{ env.ROUND }}
          path: state
          retention-days: 90
          if-no-files-found: error

      - name: hand on
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ARTIFACT: ${{ steps.up.outputs.artifact-id }}
          BUILT: ${{ steps.count.outputs.built_this_round }}
          MAIN_BUILT: ${{ steps.count.outputs.main_built }}
          N_FAILED: ${{ steps.count.outputs.n_failed }}
          PERCENT: ${{ steps.count.outputs.percent }}
          TIMED_OUT: ${{ steps.count.outputs.timed_out_shards }}
          CRASHED_NOW: ${{ steps.count.outputs.crashed_this_round }}
          CROWDED_NOW: ${{ steps.count.outputs.crowded_this_round }}
          KILLED_ALONE: ${{ steps.count.outputs.n_killed_alone }}
          TWICE: ${{ steps.count.outputs.built_twice }}
          TWICE_DIFFERENT: ${{ steps.count.outputs.built_twice_different }}
          SHARDS_REPORTED: ${{ steps.count.outputs.shards_reported }}
          SHARDS_PLANNED: ${{ needs.plan.outputs.n_shards }}
        run: |
          set -euo pipefail
          echo "state artifact id: $STATE_ARTIFACT" | tee -a "$GITHUB_STEP_SUMMARY"
          next=""
          if [ "$MAIN_BUILT" = "true" ]; then
            next=verdict
            echo "Main is built. Next: verdict." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$BUILT" = "0" ] && [ "$TIMED_OUT" != "0" ] && [ "$BUILD_MINUTES" -lt 280 ]; then
            # Some module needs more than one deadline of kernel time. Give
            # the same round twice the time, up to what one job allows.
            BUILD_MINUTES=$(( BUILD_MINUTES * 2 > 280 ? 280 : BUILD_MINUTES * 2 ))
            next=round
            echo "Round $ROUND built nothing and $TIMED_OUT shards hit the deadline. Next: round $((ROUND + 1)) with $BUILD_MINUTES build minutes." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$BUILT" = "0" ]; then
            echo "::error::round $ROUND built nothing; the chain stops here. Failed modules so far: $N_FAILED"
            echo "Stalled at ${PERCENT}% with $N_FAILED failed modules." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ROUND" -ge "$MAX_ROUND" ]; then
            echo "::warning::max_round reached; the chain stops here at ${PERCENT}%"
          else
            next=round
            echo "Built $BUILT modules this round, ${PERCENT}% in all, $N_FAILED failed. Next: round $((ROUND + 1))." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # The watchdog settles memory inside a round: it suspends the
          # smaller compile and lets the larger finish, so a crash or a
          # crowded kill is no reason to compile fewer modules at once.
          # Neither, any more, is a shard that never reported. Round 14 lost
          # one to a bug in the restore script, seven minutes in and long
          # before any compile; the rule that stood here took that for
          # memory and halved every runner, and rounds 15 and 16 ran one
          # compile at a time for it. The thread count is now only what the
          # dispatch says. Three crashes of the same module still block it
          # in the planner.
          lost=$(( ${SHARDS_PLANNED:-0} - ${SHARDS_REPORTED:-0} ))
          echo "${CRASHED_NOW:-0} modules crashed, ${CROWDED_NOW:-0} were crowded out by the watchdog, $lost shards never reported; LEAN_NUM_THREADS stays $LEAN_THREADS" | tee -a "$GITHUB_STEP_SUMMARY"
          # A module killed while it was the only compile running does not
          # fit a runner's memory. Before it counts as out of reach, one
          # round gives every runner swap to page into.
          if [ "${KILLED_ALONE:-0}" != "0" ] && [ "${SWAP_GB:-0}" = "0" ]; then
            SWAP_GB=24
            echo "${KILLED_ALONE} module(s) were killed alone for memory; the next round gives each runner ${SWAP_GB} GB of swap" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Modules two shards built this round (the filling pass). Different
          # bytes make the second copy a waste, so the pass is switched off.
          echo "${TWICE:-0} modules were built by two shards; ${TWICE_DIFFERENT:-0} of them came out with different .olean bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${TWICE_DIFFERENT:-0}" != "0" ] && [ "$FILL" = "true" ]; then
            FILL=false
            echo "::warning::${TWICE_DIFFERENT} modules built twice differ byte for byte; the filling pass is off from the next round"
          fi
          if [ "$CHAIN" != "true" ] || [ -z "$next" ]; then
            echo "chain is off or there is nothing to hand on to; stopping"
            if [ "$BUILT" = "0" ] && [ "$MAIN_BUILT" != "true" ]; then exit 1; fi
            exit 0
          fi
          gh workflow run replay-alpoge-rh.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f mode="$next" -f epoch="$EPOCH" -f round="$((ROUND + 1))" -f state_id="$STATE_ARTIFACT" \
            -f shards="$SHARDS" -f build_minutes="$BUILD_MINUTES" -f chain=true -f max_round="$MAX_ROUND" \
            -f compress_fs="$COMPRESS_FS" -f lean_threads="$LEAN_THREADS" -f fill="$FILL" -f swap_gb="$SWAP_GB"

  # --------------------------------------------------------------------------
  # remerge: a round whose shards finished and were bundled, but whose merge
  # job failed before it wrote the state. Reads that run's plan, done records
  # and bundle by run id, writes the state, and hands on. Nothing is rebuilt.
  # --------------------------------------------------------------------------
  remerge:
    if: (inputs.mode || 'round') == 'remerge'
    name: remerge round ${{ inputs.round }} from run ${{ inputs.from_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      FROM_RUN: ${{ inputs.from_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: fetch that run's plan and done records, and find its bundle
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$FROM_RUN" in ''|*[!0-9]*) echo "::error::from_run must be a run id"; exit 1;; esac
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv' < /dev/null > artifacts.tsv
          wc -l artifacts.tsv
          mkdir -p in
          bid=""
          while IFS=$'\t' read -r id name; do
            case "$name" in
              "alpoge-${EPOCH}-plan-r${ROUND}"|"alpoge-${EPOCH}-done-r${ROUND}-s"*)
                bash "$HUNT/fetch_artifact.sh" "$id" a.zip
                mkdir -p "in/$name"
                unzip -o -q a.zip -d "in/$name"
                rm -f a.zip
                ;;
              "alpoge-${EPOCH}-bundle-r${ROUND}")
                bid="$id"
                ;;
            esac
          done < artifacts.tsv
          if [ -z "$bid" ]; then echo "::error::run $FROM_RUN has no bundle for round $ROUND"; exit 1; fi
          test -f "in/alpoge-${EPOCH}-plan-r${ROUND}/dag.json"
          echo "bundle_id=$bid" >> "$GITHUB_OUTPUT"
          echo "bundle artifact id: $bid; done records: $(ls in | grep -c -- '-done-')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: fold the done records into the state
        id: count
        run: |
          set -euo pipefail
          plan="in/alpoge-${EPOCH}-plan-r${ROUND}"
          args=()
          if [ -f "$plan/state-prev.json" ]; then args+=(--state "$plan/state-prev.json"); fi
          mkdir -p state
          python3 "$HUNT/replay_shard.py" merge --dag "$plan/dag.json" "${args[@]}" \
            --done-dir in --round "$ROUND" --bundle-id "${{ steps.fetch.outputs.bundle_id }}" \
            --out state/state.json --github-output "$GITHUB_OUTPUT" | tee state/merge.json
          {
            echo "### remerge, round $ROUND, epoch $EPOCH, from run $FROM_RUN"
            echo '```'
            jq -c 'del(.failed)' state/merge.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publish the state
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-state-r${{ env.ROUND }}
          path: state
          retention-days: 90
          if-no-files-found: error

      - name: hand on
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ARTIFACT: ${{ steps.up.outputs.artifact-id }}
          BUILT: ${{ steps.count.outputs.built_this_round }}
          MAIN_BUILT: ${{ steps.count.outputs.main_built }}
          PERCENT: ${{ steps.count.outputs.percent }}
        run: |
          set -euo pipefail
          echo "state artifact id: $STATE_ARTIFACT; built in round $ROUND: $BUILT; ${PERCENT}% in all" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$CHAIN" != "true" ]; then exit 0; fi
          next=round
          if [ "$MAIN_BUILT" = "true" ]; then next=verdict; fi
          gh workflow run replay-alpoge-rh.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f mode="$next" -f epoch="$EPOCH" -f round="$((ROUND + 1))" -f state_id="$STATE_ARTIFACT" \
            -f shards="$SHARDS" -f build_minutes="$BUILD_MINUTES" -f chain=true -f max_round="$MAX_ROUND" \
            -f compress_fs="$COMPRESS_FS" -f lean_threads="$LEAN_THREADS" -f fill="$FILL" -f swap_gb="$SWAP_GB"

  # --------------------------------------------------------------------------
  # verdict: everything on one runner, nothing left to build, print the axioms
  # --------------------------------------------------------------------------
  verdict:
    if: (inputs.mode || 'round') == 'verdict' || inputs.mode == 'rehearse'
    name: ${{ inputs.mode || 'verdict' }} (${{ inputs.epoch || 'p1' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LEAN_DIR: /home/runner/replay/lean
      OUT: /home/runner/replay/out
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: record the run and free the runner's disk
        run: |
          set -euo pipefail
          mkdir -p "$OUT/evidence"
          {
            echo "zeta-lab commit: $GITHUB_SHA"
            echo "epoch $EPOCH $MODE from state artifact $STATE_ID"
            lscpu | grep -E '^(Model name|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|CPU\(s\)):' | sed 's/  */ /g' || true
            echo "runner: $(nproc) cores, $(free -g | awk '/Mem:/{print $2}') GB RAM, kernel $(uname -r)"
          } | tee "$OUT/evidence/run.txt"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo sysctl -w vm.max_map_count=2097152 | tee -a "$OUT/evidence/run.txt"
          df -h / /mnt 2>/dev/null | tee -a "$OUT/evidence/run.txt"

      - name: restore the archive from this branch's cache
        id: arc
        uses: actions/cache/restore@v4
        with:
          path: ~/replay/lean.tar.gz
          key: ${{ env.ARCHIVE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: verify and extract the archive
        run: |
          set -euo pipefail
          echo "$ARCHIVE_SHA256  $HOME/replay/lean.tar.gz" | sha256sum -c - | tee -a "$OUT/evidence/run.txt"
          tar -xzf "$HOME/replay/lean.tar.gz" -C "$HOME/replay" --no-same-owner
          rm -f "$HOME/replay/lean.tar.gz"

      - name: optional compressed volume for the build outputs
        if: env.COMPRESS_FS == 'true'
        run: |
          set -euo pipefail
          # every module of the archive lands here: always the volume
          bash "$HUNT/build_volume.sh" "$LEAN_DIR/.lake/build" 175187 0 | tee -a "$OUT/evidence/run.txt"

      - name: install elan and the toolchain the archive names
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat "$LEAN_DIR/lean-toolchain")"
          cd "$LEAN_DIR" && "$HOME/.elan/bin/lean" --version | tee -a "$OUT/evidence/run.txt"

      - name: fetch the pinned dependencies and the Mathlib olean cache
        working-directory: /home/runner/replay/lean
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tail -4 | tr '\r' '\n' | tail -4
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 0df444a360eaa60ab8c11dca51a86af692955474

      - name: restore every module from every round
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$STATE_ID" in ''|*[!0-9]*) echo "::error::verdict needs a numeric state_id"; exit 1;; esac
          bash "$HUNT/fetch_artifact.sh" "$STATE_ID" state.zip
          mkdir -p state && unzip -o -q state.zip -d state
          python3 "$HUNT/replay_shard.py" fetchmap --state state/state.json --out all.json | tee -a "$OUT/evidence/run.txt"
          bash "$HUNT/restore_chunks.sh" all.json "$LEAN_DIR" | tee -a "$OUT/evidence/run.txt"
          df -h / | tee -a "$OUT/evidence/run.txt"
          echo "olean files on disk: $(find "$LEAN_DIR/.lake/build/lib/lean" -name '*.olean' | wc -l)" | tee -a "$OUT/evidence/run.txt"
          jq '{modules_built: (.where | length), failed: (.failed | length), rounds: (.history | length)}' state/state.json | tee -a "$OUT/evidence/run.txt"
          cp state/state.json "$OUT/evidence/state.json"

      # No token is in the environment of the steps below.
      - name: lake build, every default target, which must find nothing left to do
        working-directory: /home/runner/replay/lean
        run: |
          set -uo pipefail
          start=$(date +%s)
          # how much memory Lake itself needs to hold the whole workspace
          python3 "$GITHUB_WORKSPACE/$HUNT/mem_watchdog.py" --name lake --floor-mb 0 --soft-mb 0 --resume-mb 0 \
            --log "$OUT/evidence/mem-lake.log" &
          watchdog=$!
          if [ "$MODE" = "rehearse" ]; then
            # Main is not built yet. The targets are the built modules that
            # nothing built imports, so Lake checks every module built so
            # far and must find all of them up to date.
            python3 "$GITHUB_WORKSPACE/$HUNT/replay_plan.py" dag --src "$LEAN_DIR/src" --out "$RUNNER_TEMP/dag.json"
            python3 "$GITHUB_WORKSPACE/$HUNT/replay_shard.py" builtsinks --dag "$RUNNER_TEMP/dag.json" \
              --state "$GITHUB_WORKSPACE/state/state.json" --out "$RUNNER_TEMP/sinks.txt" | tee -a "$OUT/evidence/run.txt"
            xargs -a "$RUNNER_TEMP/sinks.txt" -n 3000 lake build --no-ansi 2>&1 | tee "$OUT/evidence/final-build.log" | tail -30
            rc=${PIPESTATUS[0]}
          else
            lake build --no-ansi 2>&1 | tee "$OUT/evidence/final-build.log" | tail -30
            rc=${PIPESTATUS[0]}
          fi
          kill "$watchdog" 2>/dev/null || true
          wait "$watchdog" 2>/dev/null || true
          tail -1 "$OUT/evidence/mem-lake.log" | tee -a "$OUT/evidence/run.txt" || true
          echo "final lake build rc=$rc wall_seconds=$(( $(date +%s) - start ))" | tee -a "$OUT/evidence/run.txt"
          # Lake marks a module it built with a tick, or with a warning or an
          # information sign when the module printed something; one it only
          # checked is "Replayed". Count every kind of "Built".
          echo "modules elaborated in this job: $(grep -c -E '^(✔|⚠|ℹ) \[[0-9]+/[0-9]+\] Built ' "$OUT/evidence/final-build.log" || true)" | tee -a "$OUT/evidence/run.txt"
          echo "modules found up to date and replayed from their traces: $(grep -c -E '^(✔|⚠|ℹ) \[[0-9]+/[0-9]+\] Replayed ' "$OUT/evidence/final-build.log" || true)" | tee -a "$OUT/evidence/run.txt"
          if grep -q "declaration uses 'sorry'" "$OUT/evidence/final-build.log"; then
            echo "::error::the build log reports a declaration using sorry"; exit 1
          fi
          # the log repeats every stored warning of every module: keep it small
          zstd -q -9 --rm "$OUT/evidence/final-build.log" -o "$OUT/evidence/final-build.log.zst" || true
          exit "$rc"

      # What does a module near the top pay before it elaborates a line? It
      # imports most of the archive, on a runner whose memory holds a tenth
      # of it. Nothing built by round 17 imports more than 50,000 modules, so
      # the price of the last ones is timed here, on files that hold nothing
      # but imports of what is built (replay_shard.py probe, import_probe.py):
      # cold and warm, at the volume's own read-ahead and at a small one.
      # This measures time and checks no proof. A failure here fails nothing.
      - name: time imports of growing parts of what is built (rehearse only)
        if: success() && env.MODE == 'rehearse'
        continue-on-error: true
        working-directory: /home/runner/replay/lean
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/$HUNT/replay_shard.py" probe --dag "$RUNNER_TEMP/dag.json" \
            --state "$GITHUB_WORKSPACE/state/state.json" --targets 35000,80000 --out-dir "$RUNNER_TEMP/probe" \
            | tee -a "$OUT/evidence/run.txt"
          cp "$RUNNER_TEMP/probe/probes.json" "$OUT/evidence/probes.json"
          { losetup -l 2>/dev/null || true; findmnt -n -o SOURCE,FSTYPE,OPTIONS --target "$LEAN_DIR/.lake/build" || true; } \
            | tee -a "$OUT/evidence/run.txt"
          # The watchdog as the build shards run it: it logs what lean holds,
          # and ends a lean that would otherwise take the runner with it.
          python3 "$GITHUB_WORKSPACE/$HUNT/mem_watchdog.py" --name lean --floor-mb 700 --soft-mb 2500 --resume-mb 5000 \
            --root "$RUNNER_TEMP/probe" --log "$OUT/evidence/mem-probe.log" &
          watchdog=$!
          ulimit -s unlimited 2>/dev/null || ulimit -s 1048576 2>/dev/null || true
          python3 "$GITHUB_WORKSPACE/$HUNT/import_probe.py" --probes "$RUNNER_TEMP/probe" --out "$OUT/evidence" \
            --build-dir "$LEAN_DIR/.lake/build" \
            --plan="-1:cold -1:warm ra=128 -1:cold 0:cold 1:cold ra=restore 0:cold 1:cold" \
            -- lake env lean --tstack=400000 "{file}" | tee -a "$OUT/evidence/run.txt"
          kill "$watchdog" 2>/dev/null || true
          wait "$watchdog" 2>/dev/null || true
          {
            echo "### import probe"
            echo '```'
            cat "$OUT/evidence/import-probe.tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: print the axioms behind the five theorems of Main.lean
        if: env.MODE == 'verdict'
        working-directory: /home/runner/replay/lean
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/PrintAxioms.lean" <<'LEAN'
          import Main
          set_option maxHeartbeats 0
          #check (riemannHypothesis : RiemannHypothesis)
          #print RiemannHypothesis
          #print axioms riemannHypothesis
          #print axioms riemannZeta_eq_zero_re
          #print axioms LFunction_ne_zero_of_half_lt_re
          #print axioms LFunction_eq_zero_re
          #print axioms LFunction_eq_zero_re_of_isPrimitive
          LEAN
          # `#print axioms` walks every constant the theorem rests on, by
          # recursion. The archive compiles with a 400 MB thread stack
          # (lakefile.toml, moreLeanArgs); `lake env lean` does not pass
          # that on, so it is given here, and the main thread's limit is
          # lifted. A stack overflow in the last step would say nothing about
          # the proof and cost an hour.
          ulimit -s unlimited 2>/dev/null || ulimit -s 1048576 2>/dev/null || true
          start=$(date +%s)
          lake env lean --tstack=400000 "$RUNNER_TEMP/PrintAxioms.lean" 2>&1 | tee "$OUT/evidence/axioms.txt"
          echo "print axioms rc=${PIPESTATUS[0]} wall_seconds=$(( $(date +%s) - start ))" | tee -a "$OUT/evidence/run.txt"
          printed=$(grep -c 'depends on axioms' "$OUT/evidence/axioms.txt" || true)
          echo "axiom lines printed: $printed" | tee -a "$OUT/evidence/run.txt"
          if [ "$printed" -ne 5 ]; then
            echo "::error::expected 5 'depends on axioms' lines, saw $printed; the guard is not reading what it thinks it is"
            exit 1
          fi
          if grep -q 'sorryAx' "$OUT/evidence/axioms.txt"; then
            echo "::error::sorryAx appears in the axiom set"; exit 1
          fi
          bad=$(grep 'depends on axioms' "$OUT/evidence/axioms.txt" \
            | sed 's/.*depends on axioms: \[//; s/\]//' | tr ',' '\n' | tr -d ' ' \
            | grep -v -x -e propext -e Classical.choice -e Quot.sound || true)
          if [ -n "$bad" ]; then
            echo "::error::non-standard axiom(s): $bad"; exit 1
          fi
          {
            echo "### verdict, epoch $EPOCH"
            echo '```'
            cat "$OUT/evidence/axioms.txt"
            echo '```'
            echo "All five theorems of Main.lean depend only on propext, Classical.choice, Quot.sound."
          } >> "$GITHUB_STEP_SUMMARY"

      # Four interior statements the session reading the proof chain asked
      # for (hunts/rh_claim_atlas on its own branch): the Landau lemma through
      # which the archive reaches L-functions, its consumer, the one theorem
      # all five in Main.lean derive from, and the class-number bound. Their
      # names were read from the archive text. This step informs and never
      # decides: a wrong name fails here, not in the verdict above.
      - name: print the axioms behind four interior statements (supplementary)
        if: success() && env.MODE == 'verdict'
        continue-on-error: true
        working-directory: /home/runner/replay/lean
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/PrintAxiomsInterior.lean" <<'LEAN'
          import Main
          set_option maxHeartbeats 0
          #print axioms Deduction.zeroFree_of_rpow_window
          #print axioms UpperTheory.Comparison₂.formB
          #print axioms UpperTheory.FinalTheorems.everyCharacter
          #print axioms UpperTheory.V.SmallClassNumbers.bound
          LEAN
          ulimit -s unlimited 2>/dev/null || ulimit -s 1048576 2>/dev/null || true
          lake env lean --tstack=400000 "$RUNNER_TEMP/PrintAxiomsInterior.lean" 2>&1 | tee "$OUT/evidence/axioms-interior.txt"
          {
            echo "### four interior statements (supplementary)"
            echo '```'
            cat "$OUT/evidence/axioms-interior.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # How much of the archive do the theorems use? hunts/alpoge_replay/
      # Cone.lean walks the constants reachable from the five theorems, the
      # walk #print axioms makes, and counts the archive's modules and
      # declarations inside and outside it. The note that came with the
      # archive expects the argument to be "massively simplified"; this is the
      # first measurement of how much there is to remove. It informs and never
      # decides, and it checks no proof.
      - name: measure what the five theorems depend on (supplementary)
        if: success() && env.MODE == 'verdict'
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/cone" && cd "$RUNNER_TEMP/cone"
          cp "$LEAN_DIR/lean-toolchain" .
          printf 'name = "cone"\n\n[[lean_exe]]\nname = "cone"\nroot = "Cone"\nsupportInterpreter = true\n' > lakefile.toml
          cp "$GITHUB_WORKSPACE/$HUNT/Cone.lean" Cone.lean
          lake build cone 2>&1 | tail -3
          cd "$LEAN_DIR"
          ulimit -s unlimited 2>/dev/null || ulimit -s 1048576 2>/dev/null || true
          start=$(date +%s)
          lake env "$RUNNER_TEMP/cone/.lake/build/bin/cone" Main \
            riemannHypothesis,riemannZeta_eq_zero_re,LFunction_ne_zero_of_half_lt_re,LFunction_eq_zero_re,LFunction_eq_zero_re_of_isPrimitive \
            BuildAid,CompanionTheory,Development,Formalism,GroundTheory,Lemmata,PositivityTheory,ReciprocityTheory,Supplements,Statements,Main \
            "$OUT/evidence/cone.json" "$OUT/evidence" > /dev/null
          echo "cone rc=$? wall_seconds=$(( $(date +%s) - start ))" | tee -a "$OUT/evidence/run.txt"
          zstd -q -9 --rm "$OUT"/evidence/cone-modules-*.txt || true
          {
            echo "### what the theorems depend on (supplementary)"
            echo '```'
            jq -c '.[] | {label, constants_in_cone, archive_modules, archive_modules_in_cone, archive_declarations, archive_declarations_in_cone, archive_theorems, archive_theorems_in_cone, names_not_found}' "$OUT/evidence/cone.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: preserve the evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-${{ env.MODE }}-${{ github.run_id }}
          path: /home/runner/replay/out/evidence
          retention-days: 90
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # probe: what do the kernel's read-ahead settings do to an import?
  #
  # By round 17 a compile is mostly its imports: lean maps the .olean of every
  # module under the one it compiles, a runner keeps about 11 GB of them in
  # memory, and a module on 30,000 others no longer fits. On a page fault in a
  # mapped file the kernel reads a window around the page (128 KB by default)
  # and maps what is around it in memory (64 KB), so each .olean costs memory
  # for much more than lean looked at. This job restores what one import-only
  # file needs into a plain directory, as a build shard has it, and times
  # lean on it under several settings, cold and warm. It builds nothing and
  # checks no proof.
  # --------------------------------------------------------------------------
  probe:
    if: inputs.mode == 'probe'
    name: probe (${{ inputs.epoch || 'p1' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      LEAN_DIR: /home/runner/replay/lean
      OUT: /home/runner/replay/out
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: record the run and free the runner's disk
        run: |
          set -euo pipefail
          mkdir -p "$OUT/evidence"
          {
            echo "zeta-lab commit: $GITHUB_SHA"
            echo "epoch $EPOCH $MODE from state artifact $STATE_ID"
            lscpu | grep -E '^(Model name|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)|CPU\(s\)):' | sed 's/  */ /g' || true
            echo "runner: $(nproc) cores, $(free -g | awk '/Mem:/{print $2}') GB RAM, kernel $(uname -r)"
          } | tee "$OUT/evidence/run.txt"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo sysctl -w vm.max_map_count=2097152 | tee -a "$OUT/evidence/run.txt"
          sudo mount -t debugfs none /sys/kernel/debug 2>/dev/null || true
          df -h / | tee -a "$OUT/evidence/run.txt"

      - name: restore the archive from this branch's cache
        uses: actions/cache/restore@v4
        with:
          path: ~/replay/lean.tar.gz
          key: ${{ env.ARCHIVE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: verify and extract the archive
        run: |
          set -euo pipefail
          echo "$ARCHIVE_SHA256  $HOME/replay/lean.tar.gz" | sha256sum -c - | tee -a "$OUT/evidence/run.txt"
          tar -xzf "$HOME/replay/lean.tar.gz" -C "$HOME/replay" --no-same-owner
          rm -f "$HOME/replay/lean.tar.gz"

      - name: install elan and the toolchain the archive names
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat "$LEAN_DIR/lean-toolchain")"
          cd "$LEAN_DIR" && "$HOME/.elan/bin/lean" --version | tee -a "$OUT/evidence/run.txt"

      - name: fetch the pinned dependencies and the Mathlib olean cache
        working-directory: /home/runner/replay/lean
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tail -4 | tr '\r' '\n' | tail -4
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = 0df444a360eaa60ab8c11dca51a86af692955474

      - name: write the import-only files and restore what the larger one imports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$STATE_ID" in ''|*[!0-9]*) echo "::error::probe needs a numeric state_id"; exit 1;; esac
          bash "$HUNT/fetch_artifact.sh" "$STATE_ID" state.zip
          mkdir -p state && unzip -o -q state.zip -d state
          python3 "$HUNT/replay_plan.py" dag --src "$LEAN_DIR/src" --out "$RUNNER_TEMP/dag.json"
          python3 "$HUNT/replay_shard.py" probe --dag "$RUNNER_TEMP/dag.json" --state state/state.json \
            --targets 35000,80000 --out-dir "$RUNNER_TEMP/probe" | tee -a "$OUT/evidence/run.txt"
          cp "$RUNNER_TEMP/probe/probes.json" "$OUT/evidence/probes.json"
          # probe 1 imports what probe 0 does and more: restoring for it serves both
          python3 "$HUNT/replay_shard.py" fetchmap --state state/state.json --need "$RUNNER_TEMP/probe/probe-1.need" \
            --out probe-fetch.json | tee -a "$OUT/evidence/run.txt"
          RESTORE_NEED="$RUNNER_TEMP/probe/probe-1.need" RESTORE_SUFFIX=.olean \
            bash "$HUNT/restore_chunks.sh" probe-fetch.json "$LEAN_DIR" | tee -a "$OUT/evidence/run.txt"
          du -sh "$LEAN_DIR/.lake/build" | tee -a "$OUT/evidence/run.txt"
          df -h / | tee -a "$OUT/evidence/run.txt"
          findmnt -n -o SOURCE,FSTYPE,OPTIONS --target "$LEAN_DIR/.lake/build" | tee -a "$OUT/evidence/run.txt"

      # No token is in the environment of this step.
      - name: time the imports under several read-ahead settings
        working-directory: /home/runner/replay/lean
        run: |
          set -uo pipefail
          python3 "$GITHUB_WORKSPACE/$HUNT/mem_watchdog.py" --name lean --floor-mb 700 --soft-mb 2500 --resume-mb 5000 \
            --root "$RUNNER_TEMP/probe" --log "$OUT/evidence/mem-probe.log" &
          watchdog=$!
          ulimit -s unlimited 2>/dev/null || ulimit -s 1048576 2>/dev/null || true
          # Probe 0 imports about 45,000 modules, probe 1 about 80,000. First
          # the settings as the runners come, then small windows on both
          # probes, then the larger probe as the runners come, then each
          # setting by itself, then no read-ahead at all.
          python3 "$GITHUB_WORKSPACE/$HUNT/import_probe.py" --probes "$RUNNER_TEMP/probe" --out "$OUT/evidence" \
            --build-dir "$LEAN_DIR/.lake/build" --timeout-s 1500 --budget-s 7800 \
            --plan="0:cold 0:warm 0:warm ra=16 fa=4096 0:cold 0:warm 0:warm 1:cold 1:warm 1:warm ra=restore fa=restore 1:cold 1:warm fa=4096 0:cold 0:warm fa=restore ra=16 0:cold 0:warm ra=0 fa=4096 0:cold 0:warm 1:cold 1:warm ra=restore fa=restore" \
            -- lake env lean --tstack=400000 "{file}" | tee -a "$OUT/evidence/run.txt"
          kill "$watchdog" 2>/dev/null || true
          wait "$watchdog" 2>/dev/null || true
          {
            echo "### import probe, plain directory"
            echo '```'
            cat "$OUT/evidence/import-probe.tsv"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: preserve the evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpoge-${{ env.EPOCH }}-${{ env.MODE }}-${{ github.run_id }}
          path: /home/runner/replay/out/evidence
          retention-days: 90
          if-no-files-found: warn
