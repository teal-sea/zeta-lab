# Tier 3b — the four-point certificate package, on demand.
#
# `hunts/ainta_seven_point/lean-four-point/` is a Lake package that requires
# `lean/bridge` BY PATH, so it proves things about the same `Kfun`, `kfun`,
# `wfun`, `F` and `Phi_n` that `Zeta23Ext.Bridge.n_point_bound` consumes. It is
# not part of the Palomar submission surface and nothing in `lean/bridge`
# imports it, so it does not belong in the nightly `full` job: a red build here
# must not be readable as a red build of the advertised development.
#
# This is `three-point.yml` at `n = 4`, with one deliberate difference. The
# three-point job staged every module separately, because the point of that
# exercise was to MEASURE which shape is expensive, and staging serialises what
# `lake` would spread over the runner's four cores. That measurement is done.
# Here the 17 cell modules build in one step and the 16 chunk modules in
# another, so `lake` uses all four cores; only the boundaries between the
# machinery, the cells, the three-dimensional table and the certificate are
# staged, which is enough to say where a failure is.
name: four-point

on:
  push:
    branches: [ "bridge/four-point" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: four-point-${{ github.ref }}
  cancel-in-progress: false

jobs:
  four-point:
    name: four-point certificate, zero sorrys
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: hunts/ainta_seven_point/lean-four-point
    steps:
      - uses: actions/checkout@v4

      # Restore BEFORE installing elan, which is the order `full.yml` uses: the
      # cache carries the toolchain itself, and elan-init with
      # `--default-toolchain none` is then a no-op over it.
      #
      # The last restore-key reaches into the three-point job's cache. The two
      # packages pin the same toolchain and the same `lake-manifest.json`, so a
      # three-point cache carries a `lean/bridge/.lake` this job can use, which
      # is the 11-minute dependency step. A four-point cache always wins over
      # it: the keys are tried in order.
      - name: restore elan and lake
        uses: actions/cache/restore@v4
        id: lakecache
        with:
          path: |
            ~/.elan
            hunts/ainta_seven_point/lean-four-point/.lake
            lean/bridge/.lake
          key: four-point-${{ runner.os }}-${{ hashFiles('hunts/ainta_seven_point/lean-four-point/lake-manifest.json', 'hunts/ainta_seven_point/lean-four-point/lean-toolchain') }}-${{ github.run_id }}
          restore-keys: |
            four-point-${{ runner.os }}-${{ hashFiles('hunts/ainta_seven_point/lean-four-point/lake-manifest.json', 'hunts/ainta_seven_point/lean-four-point/lean-toolchain') }}-
            four-point-${{ runner.os }}-
            three-point-${{ runner.os }}-

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: toolchain
        run: |
          elan show || true
          lake --version

      - name: mathlib olean cache
        # Mathlib is pinned at 51e6992efd06126df61a496bebf8f49482a4e129, a real
        # master commit (2026-08-03, "chore: bump toolchain to v4.33.0-rc2"), so
        # the upstream olean cache exists for it. Without this the runner
        # compiles Mathlib from source and the loop is unusable. Not fatal if it
        # fails: the build below just becomes very slow.
        run: lake exe cache get || echo "::warning::mathlib cache get failed, falling back to source build"

      - name: dependencies (Zeta23 upstream, then the bridge)
        run: |
          set -o pipefail
          /usr/bin/time -v lake build Zeta23Ext.Bridge.Main 2>&1 | tail -200

      - name: save cache after dependencies
        # Written here rather than only at the end so that a failure in the
        # generated tables still leaves the expensive dependency build cached.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            hunts/ainta_seven_point/lean-four-point/.lake
            lean/bridge/.lake
          key: four-point-${{ runner.os }}-${{ hashFiles('hunts/ainta_seven_point/lean-four-point/lake-manifest.json', 'hunts/ainta_seven_point/lean-four-point/lean-toolchain') }}-${{ github.run_id }}

      - name: FourPoint.Base (the enclosure machinery)
        run: /usr/bin/time -p lake build FourPoint.Base

      - name: FourPoint.Cells (the one-dimensional table, 17 modules)
        run: /usr/bin/time -p lake build FourPoint.Cells

      - name: FourPoint.Cover (the one-dimensional cover)
        run: /usr/bin/time -p lake build FourPoint.Cover

      - name: FourPoint.Chunks (the three-dimensional table, 16 modules)
        run: |
          /usr/bin/time -p lake build $(for i in $(seq 0 15); do printf 'FourPoint.Chunks%d ' "$i"; done)

      - name: FourPoint.Boxes (the box routers)
        run: /usr/bin/time -p lake build FourPoint.Boxes

      - name: FourPoint.Main (certificate, bound, axiom audit)
        run: |
          set -o pipefail
          /usr/bin/time -p lake build FourPoint.Main 2>&1 | tee ../../../main-build.log

      - name: the whole library
        run: /usr/bin/time -p lake build FourPoint

      - name: axiom audit
        # `#print axioms` at the bottom of FourPoint/Main.lean prints to the
        # build log. Anything other than the three standard axioms, on any
        # advertised declaration, fails the job.
        working-directory: .
        run: |
          # `lake build` replays the diagnostics of every cached module, so
          # main-build.log carries the whole dependency tree's `#print axioms`
          # output, not just this package's. Audit OUR declarations, by name.
          #
          # Two things this must not do. It must not scan the whole tree: the
          # bridge prints `[propext, choice, Quot.sound]` wherever `Classical` is
          # open, which is the same three axioms under a shorter name, and a
          # blanket pattern reads that as a violation. And it must not pass on a
          # silent log: the six advertised names have to be found, or a build
          # that printed nothing would audit clean.
          echo "--- the advertised declarations ---"
          grep -oE "'Zeta23Ext\.Bridge\.FourPoint\.[A-Za-z0-9_']+' depends on axioms: \[[^]]*\]" \
            main-build.log || true

          if grep -E "'Zeta23Ext\.Bridge\.FourPoint\.[A-Za-z0-9_']+' depends on axioms" main-build.log \
               | grep -vE "depends on axioms: \[propext, (Classical\.)?choice, Quot\.sound\]"; then
            echo "::error::a non-standard axiom reached an advertised declaration"
            exit 1
          fi

          for d in F4_eq cover1 four_point_cert Phi_four four_point_bound four_point_bound_ratio; do
            if ! grep -qE "'Zeta23Ext\.Bridge\.FourPoint\.$d' depends on axioms: \[propext, (Classical\.)?choice, Quot\.sound\]" \
                 main-build.log; then
              echo "::error::no clean axiom line for $d -- the audit must not pass on a silent log"
              exit 1
            fi
          done
          echo "axiom audit clean: six advertised declarations, all [propext, Classical.choice, Quot.sound]"

      - name: no sorry, no axiom, no native_decide
        working-directory: hunts/ainta_seven_point/lean-four-point
        run: |
          # Comments discussing the rule are fine; a real token is not. The
          # second grep drops matches that sit in a comment line, which is the
          # `full` workflow's own idiom.
          if grep -rnE '(^|[^[:alnum:]_])(sorry|admit|native_decide|axiom|opaque|unsafe|implemented_by|extern)([^[:alnum:]_]|$)' \
               FourPoint.lean FourPoint/*.lean \
               | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(--|/-)'; then
            echo "::error::a forbidden token is present in the four-point package"
            exit 1
          fi
          echo "zero sorry, zero axiom, zero native_decide"

      - name: save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            hunts/ainta_seven_point/lean-four-point/.lake
            lean/bridge/.lake
          key: four-point-${{ runner.os }}-${{ hashFiles('hunts/ainta_seven_point/lean-four-point/lake-manifest.json', 'hunts/ainta_seven_point/lean-four-point/lean-toolchain') }}-${{ github.run_id }}-final
