name: hardy-ten-zeros

on:
  pull_request:
    paths:
      - 'hunts/hardy_ten_zeros/**'
      - 'hunts/hardy_first_zero/**'
      - 'lean/**'
      - 'requirements.txt'
      - 'zeta/**'
      - 'scripts/61_rung3_mirror.py'
      - '.github/workflows/hardy-ten-zeros.yml'
  push:
    branches: [main]
    paths:
      - 'hunts/hardy_ten_zeros/**'
      - 'hunts/hardy_first_zero/**'
      - 'lean/**'
      - 'requirements.txt'
      - 'zeta/**'
      - 'scripts/61_rung3_mirror.py'
      - '.github/workflows/hardy-ten-zeros.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardy-ten-zeros-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Ten Hardy zeros, kernel and axioms
    runs-on: ubuntu-latest
    # Measured locally at about 17 minutes for the serial build (RUNS.md); the margin covers
    # a slower runner and a cold toolchain and Mathlib cache fetch.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          # Record and verify the exact reviewed head, not a moving branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: record source and dependency pins
        run: |
          git rev-parse HEAD | tee hardy-ten-zeros-revision.txt
          cat lean/lean-toolchain lean/lake-manifest.json >> hardy-ten-zeros-revision.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: numerical controls, generator check and axiom-guard fault tests
        # Finish numerics before starting Lean on this runner.
        run: |
          python -m pip install --quiet --disable-pip-version-check -r requirements.txt
          python -c 'from zeta import rigor; assert rigor.BACKEND == "python-flint"'
          python -m pytest -q -o addopts='' hunts/hardy_ten_zeros
          python hunts/hardy_ten_zeros/gen_boxes.py --check

      - name: cache pinned toolchain and dependencies only
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            lean/.lake/packages
          key: hardy-ten-zeros-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml', 'lean/lake-manifest.json') }}

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: fetch pinned Mathlib oleans
        working-directory: lean
        # Fail if the cache cannot be fetched; do not start a full source build.
        run: lake exe cache get

      - name: rebuild the proof and every local dependency, one Lean process at a time
        run: |
          set -o pipefail
          /usr/bin/time -v env LAKE_DIR="$PWD/lean/.lake" \
            bash hunts/hardy_ten_zeros/lean/build.sh "$RUNNER_TEMP/hardy-ten-zeros-build" \
            2>&1 | tee hardy-ten-zeros-build.log

      - name: require all twenty standard-axiom reports
        run: python hunts/hardy_ten_zeros/lean/check_axioms.py hardy-ten-zeros-build.log

      - name: retain the exact revision and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardy-ten-zeros-${{ github.run_id }}
          path: |
            hardy-ten-zeros-revision.txt
            hardy-ten-zeros-build.log
          if-no-files-found: error

  verdict:
    name: Ten Hardy zeros verification produced a verdict
    needs: proof
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: a missing proof verdict is a failure
        env:
          RESULT: ${{ needs.proof.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::Ten Hardy zeros verification ended with '$RESULT'; no passing proof verdict."
            exit 1
          fi
          echo 'The exact statements compiled and all twenty axiom reports passed.'
